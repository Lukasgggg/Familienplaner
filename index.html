<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familien-Zentrum v1.1 - Ultimate Edition</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #3498db;
            --header-gradient: linear-gradient(135deg, #8e44ad, #3498db, #2ecc71);
            --border-radius: 16px;
            --shadow: 0 8px 15px rgba(0,0,0,0.05);
        }
        
        .dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; overflow-x: hidden; }

        /* --- DYNAMISCHE FARBEN --- */
        .dynamic-accent { background: var(--header-gradient) !important; color: white !important; border: none !important; }
        .dynamic-text { background: var(--header-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        .dynamic-border { border-color: var(--primary-color) !important; }

        /* --- LOGIN & MODALS --- */
        .login-overlay { position: fixed; inset: 0; background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); text-align: center; width: 320px; }
        .login-box input { width: 100%; padding: 15px; margin: 20px 0; border-radius: 12px; border: 2px solid #ddd; font-size: 1.5rem; text-align: center; outline: none; }

        /* --- 3D FLIP HEADER --- */
        .flip-container { perspective: 1500px; width: 100%; max-width: 1200px; margin: 20px auto; cursor: pointer; height: 140px; }
        .flipper { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
        .flip-container.flipped .flipper { transform: rotateY(180deg); }
        .front, .back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; background: var(--header-gradient); background-size: 300% 300%; animation: gradShift 6s ease infinite; }
        .back { transform: rotateY(180deg); background: #2c3e50; }
        @keyframes gradShift { 0% {background-position: 0% 50%} 50% {background-position: 100% 50%} 100% {background-position: 0% 50%} }

        /* --- LAYOUTS --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }

        /* Beta Sidebar Layout */
        .beta-layout { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 280px; background: var(--card-bg); border-right: 1px solid rgba(0,0,0,0.1); display: flex; flex-direction: column; padding: 20px; position: relative; }
        .sidebar.collapsed { width: 80px; }
        .sidebar.collapsed .sidebar-text, .sidebar.collapsed hr, .sidebar.collapsed .sidebar-hide { display: none; }
        .main-view { flex: 1; overflow-y: auto; padding: 30px; position: relative; }
        
        /* --- CARDS (VERSCHIEBBAR & ZUKLAPPBAR) --- */
        .card { background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; margin-bottom: 20px; border-top: 5px solid transparent; }
        .card-header { padding: 15px 20px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; cursor: grab; }
        .card-body { padding: 20px; flex: 1; overflow-y: auto; max-height: 450px; }
        .card-body.collapsed { display: none; }
        .controls { display: flex; gap: 8px; }
        .btn-mini { border: none; background: rgba(0,0,0,0.05); cursor: pointer; padding: 4px; border-radius: 6px; font-size: 0.8rem; }

        /* --- BIG CALENDAR (GOOGLE STYLE) --- */
        .big-calendar { background: var(--card-bg); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); width: 100%; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #eee; border: 1px solid #eee; }
        .cal-cell { background: var(--card-bg); min-height: 100px; padding: 8px; cursor: pointer; position: relative; }
        .cal-cell:hover { background: rgba(0,0,0,0.02); }
        .cal-cell.today { background: rgba(52, 152, 219, 0.1); border: 2px solid var(--primary-color); }
        .cal-num { font-weight: bold; margin-bottom: 5px; }
        .cal-event { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; color: white; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- SETTINGS MODAL (BIGGER) --- */
        .settings-modal { width: 80% !important; max-width: 800px !important; height: 70vh; }
        .color-preview { width: 100%; height: 40px; border-radius: 8px; margin: 10px 0; }

        /* --- BUTTONS --- */
        .btn-main { padding: 12px 20px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; background: #eee; color: #333; }
        .btn-main.active { background: var(--header-gradient); color: white; }

        .sidebar-toggle { position: absolute; top: 20px; right: -15px; background: var(--primary-color); color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10; border: 2px solid white; }
    </style>
</head>
<body id="app-body">

<div class="login-overlay" id="login-screen">
    <div class="login-box">
        <h2 class="dynamic-text">Familien-Zentrum 1.1</h2>
        <input type="password" id="pin-input" maxlength="4" placeholder="PIN" onkeydown="if(event.key === 'Enter') checkPin()">
        <button class="btn-main active" style="width:100%" onclick="checkPin()">Einloggen</button>
        <p id="pin-error" style="color:red; margin-top:10px; display:none">Falscher PIN!</p>
    </div>
</div>

<div id="app-content" style="display:none">
    
    <div id="view-normal" class="container">
        <div class="flip-container" id="header-flip" onclick="flipHeader()">
            <div class="flipper">
                <div class="front">
                    <h1 id="clock">00:00:00</h1>
                    <p id="date">Datum</p>
                </div>
                <div class="back" onclick="event.stopPropagation()">
                    <h2>v1.1 Premium</h2>
                    <button class="btn-main active" onclick="openSettings()">⚙️ Einstellungen</button>
                </div>
            </div>
        </div>

        <div class="family-nav" id="person-nav-normal" style="margin-bottom:30px; display:flex; justify-content:center; gap:10px;">
            </div>

        <div id="dashboard-normal" class="dashboard-grid">
            </div>
    </div>

    <div id="view-beta" class="beta-layout" style="display:none">
        <div class="sidebar" id="app-sidebar">
            <div class="sidebar-toggle" onclick="toggleSidebar()"> ➔ </div>
            <h2 class="sidebar-text dynamic-text">Menu</h2>
            <hr style="margin:15px 0">
            <div id="person-nav-beta" style="display:flex; flex-direction:column; gap:10px;"></div>
            <hr style="margin:15px 0">
            <button class="btn-main" onclick="toggleDarkMode()">🌓 Dark Mode</button>
            <button class="btn-main" onclick="openSettings()">⚙️ Einstellungen</button>
            <div class="sidebar-text" id="beta-clock-small" style="margin-top:auto; text-align:center; font-weight:bold;">00:00</div>
        </div>
        <div class="main-view">
            <div id="beta-header" style="text-align:center; margin-bottom:30px;">
                <h2 id="beta-title" class="dynamic-text">Person</h2>
                <div id="beta-clock-top" style="display:none; font-weight:bold; font-size:1.2rem;">00:00</div>
            </div>
            
            <div id="family-calendar-beta" class="big-calendar" style="display:none; margin-bottom:30px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <button class="btn-main" onclick="changeMonth(-1)">◀</button>
                    <h2 id="cal-month-name">Monat</h2>
                    <div>
                        <button class="btn-main" onclick="jumpToToday()">Heute</button>
                        <button class="btn-main" onclick="changeMonth(1)">▶</button>
                    </div>
                </div>
                <div class="cal-grid" id="cal-grid-body"></div>
            </div>

            <div id="dashboard-beta" class="dashboard-grid"></div>
        </div>
    </div>
</div>

<div id="settings-modal" class="login-overlay" style="display:none; background:rgba(0,0,0,0.5)">
    <div class="login-box settings-modal">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Einstellungen</h2>
            <button class="btn-main" onclick="closeSettings()">X</button>
        </div>
        <div style="text-align:left; margin-top:20px; display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
            <div>
                <label>Ansicht:</label>
                <select id="set-view" class="btn-main" style="width:100%" onchange="applyView()">
                    <option value="normal">Normal</option>
                    <option value="beta">Beta (Professionell)</option>
                    <option value="simple">Einfach (Beta 2)</option>
                </select>
                <br><br>
                <label>Header-Farbe:</label>
                <select id="set-color" class="btn-main" style="width:100%" onchange="applyGradient()">
                    <option value="linear-gradient(135deg, #8e44ad, #3498db, #2ecc71)">Klassisch</option>
                    <option value="linear-gradient(135deg, #f1c40f, #e67e22, #e74c3c)">Sunset</option>
                    <option value="linear-gradient(135deg, #00cec9, #0984e3, #6c5ce7)">Ocean</option>
                    <option value="linear-gradient(135deg, #11998e, #38ef7d)">Nature</option>
                </select>
                <div id="grad-preview" class="color-preview"></div>
            </div>
            <div style="background:rgba(0,0,0,0.02); padding:15px; border-radius:12px;">
                <label>PIN ändern:</label>
                <input type="password" id="pin-old" placeholder="Aktueller PIN" style="font-size:1rem; padding:8px; margin:5px 0;">
                <input type="password" id="pin-new1" placeholder="Neuer PIN" style="font-size:1rem; padding:8px; margin:5px 0;">
                <input type="password" id="pin-new2" placeholder="PIN bestätigen" style="font-size:1rem; padding:8px; margin:5px 0;">
                <button class="btn-main active" style="width:100%" onclick="updatePin()">PIN Speichern</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- DATEN & KONFIGURATION ---
    let GEHEIMER_PIN = "1234";
    let activeMember = "Lukas";
    let config = { view: 'normal', gradient: 'linear-gradient(135deg, #8e44ad, #3498db, #2ecc71)', darkMode: false };
    let familyData = { Lukas: { t: [], d: [] }, Kathrin: { t: [], d: [] }, Marlene: { t: [], d: [] }, Anna: { d: [] }, Robert: { d: [] }, Familie: { e: [], d: [] } };
    let monthOffset = 0;

    // Firebase Dummy-Initialisierung (Nutze deine echten Daten hier!)
    const firebaseConfig = { databaseURL: "https://dashboard-4dacb-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- INITIALISIERUNG ---
    function checkPin() {
        const input = document.getElementById('pin-input').value;
        if(input === GEHEIMER_PIN) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            initApp();
        } else {
            document.getElementById('pin-error').style.display = 'block';
        }
    }

    function initApp() {
        loadFromFirebase();
        updateClock();
        setInterval(updateClock, 1000);
        applyGradient();
        switchMember(activeMember);
    }

    function updateClock() {
        const now = new Date();
        const time = now.toLocaleTimeString('de-DE');
        document.getElementById('clock').textContent = time;
        document.getElementById('beta-clock-small').textContent = time.substring(0, 5);
        document.getElementById('beta-clock-top').textContent = time;
        document.getElementById('date').textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    // --- NAVIGATION & VIEWS ---
    function switchMember(name) {
        activeMember = name;
        document.getElementById('beta-title').textContent = name;
        
        // Buttons highlighten
        renderNav();
        renderDashboard();
        
        if(name === "Familie" && config.view !== 'normal') {
            document.getElementById('family-calendar-beta').style.display = 'block';
            renderBigCalendar();
        } else {
            document.getElementById('family-calendar-beta').style.display = 'none';
        }
    }

    function renderNav() {
        const members = ["Lukas", "Kathrin", "Marlene", "Anna", "Robert", "Familie"];
        const containers = ["person-nav-normal", "person-nav-beta"];
        
        containers.forEach(contId => {
            const cont = document.getElementById(contId);
            cont.innerHTML = "";
            members.forEach(m => {
                const btn = document.createElement('button');
                btn.className = `btn-main ${m === activeMember ? 'active' : ''}`;
                btn.textContent = m;
                btn.onclick = () => switchMember(m);
                cont.appendChild(btn);
            });
        });
    }

    // --- DASHBOARD CARDS (DRAG & COLLAPSE) ---
    function renderDashboard() {
        const cont = config.view === 'normal' ? document.getElementById('dashboard-normal') : document.getElementById('dashboard-beta');
        document.getElementById('dashboard-normal').innerHTML = "";
        document.getElementById('dashboard-beta').innerHTML = "";

        const sections = [
            { id: 'sec-topics', title: 'Themen', show: activeMember !== "Anna" && activeMember !== "Robert" && activeMember !== "Familie" },
            { id: 'sec-todo', title: 'To-Dos', show: true },
            { id: 'sec-done', title: 'Erledigt', show: true }
        ];

        sections.forEach(s => {
            if(!s.show) return;
            const card = document.createElement('div');
            card.className = "card dynamic-border";
            card.draggable = true;
            card.innerHTML = `
                <div class="card-header">
                    <span style="font-weight:bold">${s.title}</span>
                    <div class="controls">
                        <button class="btn-mini" onclick="toggleCard(this)">➖</button>
                    </div>
                </div>
                <div class="card-body" id="body-${s.id}">
                    <p style="opacity:0.5; font-size:0.9rem;">Keine Einträge vorhanden...</p>
                </div>
            `;
            cont.appendChild(card);
        });
    }

    function toggleCard(btn) {
        const body = btn.parentElement.parentElement.nextElementSibling;
        body.classList.toggle('collapsed');
        btn.textContent = body.classList.contains('collapsed') ? "➕" : "➖";
    }

    // --- BIG CALENDAR LOGIK ---
    function renderBigCalendar() {
        const grid = document.getElementById('cal-grid-body');
        grid.innerHTML = "";
        const now = new Date();
        const firstDay = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
        const lastDay = new Date(now.getFullYear(), now.getMonth() + monthOffset + 1, 0);
        
        document.getElementById('cal-month-name').textContent = firstDay.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });

        // Leere Tage am Anfang
        let startShift = (firstDay.getDay() + 6) % 7;
        for(let i=0; i<startShift; i++) grid.innerHTML += `<div class="cal-cell"></div>`;

        for(let d=1; d<=lastDay.getDate(); d++) {
            const cellDate = new Date(now.getFullYear(), now.getMonth() + monthOffset, d);
            const isToday = cellDate.toDateString() === now.toDateString();
            const cell = document.createElement('div');
            cell.className = `cal-cell ${isToday ? 'today' : ''}`;
            cell.innerHTML = `<div class="cal-num">${d}</div>`;
            cell.onclick = () => alert("Termin eintragen für den " + d + ".");
            grid.appendChild(cell);
        }
    }

    function changeMonth(dir) { monthOffset += dir; renderBigCalendar(); }
    function jumpToToday() { monthOffset = 0; renderBigCalendar(); }

    // --- SETTINGS & DESIGN ---
    function flipHeader() {
        const flip = document.getElementById('header-flip');
        flip.classList.add('flipped');
        setTimeout(() => flip.classList.remove('flipped'), 5000);
    }

    function openSettings() { document.getElementById('settings-modal').style.display='flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display='none'; }

    function applyGradient() {
        const grad = document.getElementById('set-color').value;
        config.gradient = grad;
        document.getElementById('app-body').style.setProperty('--header-gradient', grad);
        document.getElementById('grad-preview').style.background = grad;
        
        // Primärfarbe aus Gradient extrahieren (einfachheitshalber nehmen wir Blau/Violett)
        const color = grad.includes('f1c40f') ? '#e67e22' : (grad.includes('00cec9') ? '#0984e3' : '#8e44ad');
        document.getElementById('app-body').style.setProperty('--primary-color', color);
    }

    function applyView() {
        config.view = document.getElementById('set-view').value;
        document.getElementById('view-normal').style.display = config.view === 'normal' ? 'block' : 'none';
        document.getElementById('view-beta').style.display = config.view !== 'normal' ? 'flex' : 'none';
        
        // Beta 2 (Einfach) Anpassung
        if(config.view === 'simple') {
            document.getElementById('beta-clock-top').style.display = 'block';
            document.getElementById('beta-clock-small').style.display = 'none';
        } else {
            document.getElementById('beta-clock-top').style.display = 'none';
            document.getElementById('beta-clock-small').style.display = 'block';
        }
        switchMember(activeMember);
    }

    function toggleSidebar() {
        document.getElementById('app-sidebar').classList.toggle('collapsed');
    }

    function toggleDarkMode() {
        config.darkMode = !config.darkMode;
        document.getElementById('app-body').classList.toggle('dark-mode');
    }

    function updatePin() {
        const oldP = document.getElementById('pin-old').value;
        const n1 = document.getElementById('pin-new1').value;
        const n2 = document.getElementById('pin-new2').value;
        if(oldP === GEHEIMER_PIN && n1 === n2 && n1.length === 4) {
            GEHEIMER_PIN = n1;
            alert("PIN erfolgreich geändert!");
            closeSettings();
        } else {
            alert("Fehler beim Ändern des PINs!");
        }
    }

    // Firebase Lade-Logik (Platzhalter)
    function loadFromFirebase() {
        console.log("Daten werden geladen...");
        // Hier snapshot.val() Logik einfügen
    }
</script>

</body>
</html>

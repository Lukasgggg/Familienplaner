<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familien- & Projekt-Zentrum v1.47</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #3498db;
            --header-gradient: linear-gradient(135deg, #8e44ad, #3498db, #2ecc71);
            --border-radius: 16px;
            --shadow: 0 8px 15px rgba(0,0,0,0.05);
        }
        
        .dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; transition: background 0.2s, color 0.2s, width 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; overflow-x: hidden; }

        .quick-version-toggle {
            position: fixed; top: 15px; right: 15px; z-index: 4500;
            background: var(--header-gradient); color: white; border: 2px solid var(--card-bg);
            padding: 8px 16px; border-radius: 30px; font-weight: bold; font-size: 0.9rem; cursor: pointer;
            box-shadow: var(--shadow); display: flex; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .quick-version-toggle:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }

        .login-overlay { position: fixed; inset: 0; background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .login-box { background: var(--card-bg); padding: 30px; border-radius: 24px; box-shadow: var(--shadow); text-align: center; width: 90%; max-width: 450px; }
        .login-box input[type="password"], .login-box input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 2px solid #ddd; font-size: 1.1rem; background: var(--card-bg); color: var(--text-color); outline: none; }

        .flip-container { perspective: 1500px; width: 100%; max-width: 1200px; margin: 20px auto; cursor: pointer; height: 140px; }
        .flipper { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s; }
        .flip-container.flipped .flipper { transform: rotateY(180deg); }
        .front, .back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; background: var(--header-gradient); background-size: 300% 300%; animation: gradShift 6s ease infinite; box-shadow: var(--shadow); }
        .back { transform: rotateY(180deg); background: #2c3e50; }
        @keyframes gradShift { 0% {background-position: 0% 50%} 50% {background-position: 100% 50%} 100% {background-position: 0% 50%} }

        .glow-text-clock { font-size: 2.2rem; font-weight: 800; background: var(--header-gradient); background-size: 300% 300%; animation: gradShift 6s ease infinite; -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }

        .btn-main { padding: 12px 20px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; background: #e0e0e0; color: #333; font-size: 1rem; }
        .btn-main.active { background-color: var(--primary-color); color: white; }
        .dark-mode .btn-main { background: #333; color: #e0e0e0; }
        .dark-mode .btn-main.active { background-color: var(--primary-color); color: white; }
        .btn-skip-mini { padding: 4px 10px; font-size: 0.8rem; border-radius: 6px; border: none; background: rgba(0,0,0,0.08); color: var(--text-color); cursor: pointer; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 25px; width: 100%; min-height: 200px; }

        .minimized-dock { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; width: 100%; }

        .beta-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
        .sidebar { width: 280px; background: var(--card-bg); border-right: 1px solid rgba(0,0,0,0.1); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; overflow-x: hidden; transition: width 0.3s; }
        .sidebar.collapsed { width: 0px; padding: 20px 0; border: none; }
        .sidebar .sidebar-content { display: flex; flex-direction: column; height: 100%; width: 240px; }
        .sidebar.collapsed .sidebar-content { display: none; }
        .main-view { flex: 1; overflow-y: auto; padding: 25px; width: 100%; }
        
        .sidebar-toggle { position: absolute; top: 20px; right: 5px; background: var(--primary-color); color: white; border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 110; border: 2px solid var(--card-bg); font-weight: bold; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; z-index: 100; }
            .sidebar.collapsed { width: 0px; }
            .quick-version-toggle { top: auto; bottom: 15px; right: 15px; }
        }

        /* --- CARDS --- */
        .card { 
            background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow); 
            display: flex; flex-direction: column; border-top: 5px solid var(--primary-color); 
            height: 480px; resize: both; overflow: auto; position: relative;
        }
        .card-header { 
            padding: 15px 20px; border-bottom: 1px solid rgba(0,0,0,0.05); 
            display: flex; justify-content: space-between; align-items: center; 
            cursor: grab; user-select: none; background: rgba(0,0,0,0.01);
        }
        .card-header:active { cursor: grabbing; }
        .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; overflow: auto; }
        .btn-mini { border: none; background: rgba(0,0,0,0.05); cursor: pointer; padding: 6px; border-radius: 6px; font-size: 0.8rem; color: var(--text-color); }
        
        .card-placeholder { border: 2px dashed var(--primary-color); background: rgba(52, 152, 219, 0.05); border-radius: 20px; height: 480px; }
        .card-mini-floating { background: var(--card-bg); color: var(--text-color); display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: var(--shadow); border-left: 4px solid var(--primary-color); }

        .input-group { display: flex; gap: 6px; margin-bottom: 12px; }
        .input-group input, .input-group select { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; background: var(--card-bg); color: var(--text-color); }
        .input-group button { background-color: var(--primary-color); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .list-container { overflow-y: auto; flex: 1; list-style: none; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: rgba(0,0,0,0.02); border-radius: 6px; margin-bottom: 8px; border-left: 4px solid var(--primary-color); }
        .dark-mode .list-item { background-color: rgba(255,255,255,0.02); }
        .clickable-text { cursor: pointer; flex: 1; }
        .btn-delete { background: none; border: none; color: #e74c3c; cursor: pointer; font-weight: bold; padding: 0 5px; }

        /* --- SCHREIB TOOL LAYOUT --- */
        .editor-container { display: flex; gap: 15px; flex: 1; height: 100%; overflow: hidden; }
        .editor-sidebar { width: 140px; border-right: 1px solid rgba(0,0,0,0.1); padding-right: 10px; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
        .editor-main { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .editor-textarea { flex: 1; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: var(--bg-color); color: var(--text-color); resize: none; font-size: 0.95rem; line-height: 1.4; outline: none; }
        .doc-tab { padding: 8px; font-size: 0.8rem; background: rgba(0,0,0,0.03); border: none; border-radius: 6px; cursor: pointer; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-color); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .doc-tab.active { background: var(--primary-color); color: white; }
        .dark-mode .doc-tab { background: rgba(255,255,255,0.05); color: var(--text-color); }
        .dark-mode .doc-tab.active { background: var(--primary-color); color: white; }

        .big-calendar { background: var(--card-bg); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); width: 100%; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .cal-cell { background: rgba(0,0,0,0.02); min-height: 95px; padding: 8px; cursor: pointer; border-radius: 8px; display: flex; flex-direction: column; gap: 4px; border: 1px solid rgba(0,0,0,0.03); }
        .cal-cell.today { background: rgba(52, 152, 219, 0.15); border: 2px solid var(--primary-color); }
        .cal-event { font-size: 0.75rem; padding: 2px 6px; color: white; border-radius: 4px; font-weight: bold; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }

        .mobile-cal-list { display: none; flex-direction: column; gap: 10px; margin-top: 15px; }
        @media (max-width: 768px) { .cal-grid { display: none !important; } .mobile-cal-list { display: flex !important; } .editor-container { flex-direction: column; } .editor-sidebar { width: 100%; border-right: none; max-height: 90px; flex-direction: row; } }

        .features-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: left; margin: 10px 0; }
        .features-grid label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; }
    </style>
</head>
<body id="app-body">

<button class="quick-version-toggle" id="quick-toggle-btn" style="display:none;" onclick="quickToggleView()">
    🔄 <span id="quick-toggle-text">Wechsle zu Beta 1.12</span>
</button>

<div class="login-overlay" id="login-screen">
    <div class="login-box">
        <h2>🔒 Familien- & Projekt-Zentrum</h2>
        <input type="password" id="pin-input" maxlength="4" placeholder="••••" onkeydown="if(event.key === 'Enter') checkPin()">
        <button class="btn-main active" style="width:100%" onclick="checkPin()">Einloggen</button>
    </div>
</div>

<div id="app-content" style="display:none">
    
    <div id="view-normal" class="container">
        <div class="flip-container header-flip-element" onclick="flipHeader()">
            <div class="flipper">
                <div class="front">
                    <h1 class="clock-display" style="font-size: 2.8rem;">00:00:00</h1>
                    <p class="date-display">Lade...</p>
                </div>
                <div class="back" onclick="event.stopPropagation()">
                    <h2>System Version 1.47</h2>
                    <button class="btn-main active" style="margin-top:10px;" onclick="openSettings()">⚙️ Einstellungen & Profile</button>
                </div>
            </div>
        </div>

        <div class="family-nav" id="person-nav-normal" style="margin-bottom:25px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;"></div>
        <div style="text-align:center; margin-bottom:20px;">
            <h2 id="current-title-normal">Dashboard</h2>
            <div class="minimized-dock" id="dock-normal"></div>
        </div>
        <div id="dashboard-normal" class="dashboard-grid"></div>
    </div>

    <div id="view-beta" class="beta-layout" style="display:none">
        <div class="sidebar-toggle" id="side-arrow" onclick="toggleSidebar()">◀</div>
        <div class="sidebar" id="app-sidebar">
            <div class="sidebar-content">
                <h2>Menu</h2>
                <hr style="margin:15px 0; opacity:0.2;">
                <div id="person-nav-beta" style="display:flex; flex-direction:column; gap:10px;"></div>
                <hr style="margin:15px 0; opacity:0.2;">
                <button class="btn-main" onclick="toggleDarkMode()">🌓 Dark Mode</button>
                <button class="btn-main" style="margin-top:10px;" onclick="openSettings()">⚙️ Einstellungen</button>
                <div id="beta-clock-small" style="margin-top:auto; text-align:center; font-weight:bold;">00:00</div>
            </div>
        </div>
        
        <div class="main-view">
            <div style="text-align:center; margin-bottom:25px;">
                <div class="glow-text-clock clock-display">00:00:00</div>
                <div class="date-display" style="opacity:0.7; font-size:1rem; font-weight:600;">Lade...</div>
                <h2 id="beta-title" style="font-size:2.2rem; margin-top:15px;">Dashboard</h2>
                <div class="minimized-dock" id="dock-beta" style="margin-top:15px;"></div>
            </div>
            <div id="dashboard-beta" class="dashboard-grid"></div>
        </div>
    </div>
</div>

<div id="event-modal" class="login-overlay" style="display:none; background:rgba(0,0,0,0.6); z-index:4000;">
    <div class="login-box" style="text-align:left; max-width:450px;">
        <h3>📅 Neuen Termin eintragen</h3>
        <input type="text" id="quick-event-name" placeholder="Terminbeschreibung...">
        <label>Farbe:</label>
        <select id="quick-event-color" class="btn-main" style="width:100%; margin-top:5px; background:var(--card-bg);">
            <option value="#3498db">Blau</option>
            <option value="#e67e22">Orange</option>
            <option value="#2ecc71">Grün</option>
            <option value="#e74c3c">Rot</option>
            <option value="#9b59b6">Violett</option>
        </select>
        <input type="hidden" id="quick-event-date">
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-main active" style="flex:1;" onclick="saveQuickEvent()">Speichern</button>
            <button class="btn-main" style="flex:1;" onclick="document.getElementById('event-modal').style.display='none'">Abbrechen</button>
        </div>
    </div>
</div>

<div id="settings-modal" class="login-overlay" style="display:none; background:rgba(0,0,0,0.6)">
    <div class="login-box" style="width:90%; max-width:750px; max-height:85vh; overflow-y:auto; text-align:left;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #eee; padding-bottom:10px;">
            <h2>⚙️ App-Steuerung & Profile</h2>
            <button class="btn-main" onclick="document.getElementById('settings-modal').style.display='none'">X</button>
        </div>
        
        <div style="margin-top:15px; display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:20px;">
            <div>
                <h4>System-Design</h4>
                <label>Version:</label>
                <select id="set-view" class="btn-main" style="width:100%; background:var(--card-bg);" onchange="applyView()">
                    <option value="normal">Version 1.1</option>
                    <option value="beta">Beta 1.12</option>
                </select>
                <br><br>
                <label>Theme Verlauf:</label>
                <select id="set-color" class="btn-main" style="width:100%; background:var(--card-bg);" onchange="applyGradient()">
                    <option value="linear-gradient(135deg, #8e44ad, #3498db, #2ecc71)">Klassik</option>
                    <option value="linear-gradient(135deg, #00f2fe, #4facfe)">Neon Cyber</option>
                    <option value="linear-gradient(135deg, #43e97b, #38f9d7)">Nordic Mint</option>
                    <option value="linear-gradient(135deg, #f1c40f, #e67e22, #e74c3c)">Sunset</option>
                </select>
            </div>

            <div style="background:rgba(0,0,0,0.03); padding:15px; border-radius:12px;">
                <h4>👤 Neue Person / Profil hinzufügen</h4>
                <input type="text" id="new-member-name" placeholder="Name der Person..." style="padding:8px; width:100%; margin-top:5px;">
                
                <p style="font-size:0.85rem; font-weight:bold; margin-top:8px;">Kärtchen-Ausstattung (Features):</p>
                <div class="features-grid">
                    <label><input type="checkbox" id="feat-todo" checked>📝 To-Do-Liste</label>
                    <label><input type="checkbox" id="feat-topics" checked>📚 Lernthemen</label>
                    <label><input type="checkbox" id="feat-cal">📅 Eigener Kalender</label>
                    <label><input type="checkbox" id="feat-project">🚀 Projekt-Planer</label>
                    <label><input type="checkbox" id="feat-ideas">💡 Ideen-Speicher</label>
                    <label><input type="checkbox" id="feat-editor" checked>✍️ Text-Editor / Dokumente</label>
                </div>
                <button class="btn-main active" style="width:100%; margin-top:5px;" onclick="createNewMember()">Profil erstellen</button>
                
                <h5 style="margin-top:15px; color:#e74c3c;">Profile löschen:</h5>
                <div id="delete-profiles-list" style="max-height:100px; overflow-y:auto; margin-top:5px;"></div>
            </div>
        </div>
    </div>
</div>

<div id="notes-modal" class="login-overlay" style="display:none; background:rgba(0,0,0,0.5)">
    <div class="login-box" style="text-align:left;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="modal-title">Details</h3>
            <button class="btn-main" onclick="document.getElementById('notes-modal').style.display='none'">X</button>
        </div>
        <ul id="modal-notes-list" style="list-style:none; max-height:200px; overflow-y:auto; margin-bottom:15px;"></ul>
        <div class="input-group"><input type="text" id="note-input" placeholder="Unterpunkt ergänzen..."><button onclick="addNote()">Merken</button></div>
    </div>
</div>

<script>
    let GEHEIMER_PIN = "1234";
    let activeMember = "";
    let config = { view: 'normal', gradient: 'linear-gradient(135deg, #8e44ad, #3498db, #2ecc71)', darkMode: false };
    
    let familyData = {};
    let collapsedCards = {};
    let monthOffset = 0;
    let activeDocIndex = 0;

    const firebaseConfig = {
        apiKey: "AIzaSyAxam2TnWekNHYsKGfVfYoFEz2Jo-QZjEs",
        authDomain: "dashboard-4dacb.firebaseapp.com",
        databaseURL: "https://dashboard-4dacb-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "dashboard-4dacb",
        storageBucket: "dashboard-4dacb.appspot.com",
        appId: "1:252785957836:web:498c30a1eb9e7a6b72db69"
    };
    
    // Firebase sicher initialisieren
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    function checkPin() {
        const inp = document.getElementById('pin-input').value;
        if(inp === GEHEIMER_PIN) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            if(document.getElementById('quick-toggle-btn')) {
                document.getElementById('quick-toggle-btn').style.display = 'flex';
            }
            initApp();
        } else { alert("Falscher PIN!"); }
    }

    function initApp() {
        database.ref('familyZentrumConfig/pin').on('value', (s) => { if(s.val()) GEHEIMER_PIN = s.val().toString(); });
        
        database.ref('dynamicFamilyData').on('value', (snapshot) => {
            try {
                const data = snapshot.val();
                if (data && typeof data === 'object') { 
                    familyData = data; 
                } else {
                    familyData = {
                        Lukas: { features: { todo: true, topics: true, cal: false, project: true, ideas: true, editor: true }, todos: [], topics: [], projects: [], ideas: [], events: [], docs: [{title: 'Notizen', text: ''}] }
                    };
                }
                
                // Absolute Absicherung der Datenstruktur, damit beim Rendern NIEMALS etwas crasht
                Object.keys(familyData).forEach(name => {
                    if (!familyData[name]) familyData[name] = {};
                    if (!familyData[name].features) familyData[name].features = { todo: true, topics: true, cal: false, project: true, ideas: true, editor: true };
                    if (!familyData[name].docs || !Array.isArray(familyData[name].docs)) familyData[name].docs = [{title: 'Notizen', text: ''}];
                    if (!familyData[name].todos) familyData[name].todos = [];
                    if (!familyData[name].topics) familyData[name].topics = [];
                    if (!familyData[name].projects) familyData[name].projects = [];
                    if (!familyData[name].ideas) familyData[name].ideas = [];
                    if (!familyData[name].events) familyData[name].events = [];
                });

                if (!activeMember || !familyData[activeMember]) { 
                    activeMember = Object.keys(familyData)[0] || "Lukas"; 
                }
                renderAll();
            } catch(err) {
                console.error("Fehler beim Laden der Daten:", err);
            }
        });
        
        updateClock(); 
        if(!window.clockInterval) window.clockInterval = setInterval(updateClock, 1000); 
        applyGradient();
    }

    function updateClock() {
        const now = new Date(); const time = now.toLocaleTimeString('de-DE');
        document.querySelectorAll('.clock-display').forEach(el => el.textContent = time);
        const smallClock = document.getElementById('beta-clock-small');
        if(smallClock) smallClock.textContent = time.substring(0,5);
        document.querySelectorAll('.date-display').forEach(el => el.textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }));
    }

    function syncData() { database.ref('dynamicFamilyData').set(familyData); }

    function createNewMember() {
        const nameInput = document.getElementById('new-member-name');
        const name = nameInput.value.trim();
        if(!name) return alert("Bitte einen Namen eingeben!");
        
        familyData[name] = {
            features: {
                todo: document.getElementById('feat-todo').checked,
                topics: document.getElementById('feat-topics').checked,
                cal: document.getElementById('feat-cal').checked,
                project: document.getElementById('feat-project').checked,
                ideas: document.getElementById('feat-ideas').checked,
                editor: document.getElementById('feat-editor').checked
            },
            todos: [], topics: [], projects: [], ideas: [], events: [], docs: [{title: 'Notizen', text: ''}]
        };
        nameInput.value = "";
        syncData();
        alert(`Profil für ${name} angelegt!`);
        renderDeleteProfilesList();
    }

    function deleteMember(name) {
        if(confirm(`Möchtest du das Profil von ${name} wirklich komplett löschen?`)) {
            delete familyData[name];
            syncData();
            renderDeleteProfilesList();
        }
    }

    function renderDeleteProfilesList() {
        const div = document.getElementById('delete-profiles-list'); if(!div) return; div.innerHTML = "";
        Object.keys(familyData).forEach(name => {
            div.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>${name}</span><button class="btn-delete" onclick="deleteMember('${name}')">🗑️</button></div>`;
        });
    }

    function openSettings() { renderDeleteProfilesList(); document.getElementById('settings-modal').style.display='flex'; }
    function switchMember(name) { activeMember = name; activeDocIndex = 0; renderAll(); }

    function renderAll() {
        try {
            const isBeta = config.view === 'beta';
            const grid = document.getElementById(isBeta ? 'dashboard-beta' : 'dashboard-normal');
            const dock = document.getElementById(isBeta ? 'dock-beta' : 'dock-normal');
            if(!grid) return; grid.innerHTML = ""; if(dock) dock.innerHTML = "";

            ["person-nav-normal", "person-nav-beta"].forEach(id => {
                const cont = document.getElementById(id); if(!cont) return; cont.innerHTML = "";
                Object.keys(familyData).forEach(m => {
                    const b = document.createElement('button'); b.className = `btn-main ${m === activeMember ? 'active' : ''}`; b.textContent = m; b.onclick = () => switchMember(m); cont.appendChild(b);
                });
            });

            const titleNormal = document.getElementById('current-title-normal');
            if(titleNormal) titleNormal.textContent = `Dashboard von ${activeMember}`;
            const titleBeta = document.getElementById('beta-title');
            if(titleBeta) titleBeta.textContent = `Dashboard von ${activeMember}`;

            const currentPerson = familyData[activeMember] || { features: {} };
            const feats = currentPerson.features || {};

            const cardTypes = [
                { id: 'cal', title: '📅 Eigener Kalender', show: feats.cal },
                { id: 'editor', title: '✍️ Text-Editor & Dokumente', show: feats.editor },
                { id: 'topics', title: '📚 Lernthemen / Fachbereiche', show: feats.topics },
                { id: 'project', title: '🚀 Projekt-Planer', show: feats.project },
                { id: 'ideas', title: '💡 Ideen-Speicher', show: feats.ideas },
                { id: 'todo', title: '📝 Aufgaben (To-Do)', show: feats.todo }
            ];

            cardTypes.forEach(c => {
                if(!c.show) return;
                const cardKey = c.id + activeMember;

                if(collapsedCards[cardKey] && dock) {
                    const mini = document.createElement('div'); mini.className = "card-mini-floating"; mini.innerHTML = `<span>${c.title}</span> <b>+</b>`; mini.onclick = () => { collapsedCards[cardKey] = false; renderAll(); };
                    dock.appendChild(mini); return;
                }

                const card = document.createElement('div');
                card.className = "card"; card.setAttribute('draggable', 'true'); card.setAttribute('data-id', c.id);
                if(c.id === 'editor') card.style.height = "520px";
                
                let html = `
                    <div class="card-header"><span>☰ ${c.title}</span><button class="btn-mini" onclick="collapseCardAction('${cardKey}')">➖</button></div>
                    <div class="card-body">`;

                if(c.id === 'cal') {
                    html += `
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <button class="btn-skip-mini" onclick="changeMonth(-1)">◀</button><strong id="cal-title-lbl">Monat</strong><button class="btn-skip-mini" onclick="changeMonth(1)">▶</button>
                        </div><div class="cal-grid" id="inner-cal-grid"></div><div class="mobile-cal-list" id="inner-cal-list"></div>`;
                } else if(c.id === 'editor') {
                    html += `
                        <div class="editor-container">
                            <div class="editor-sidebar" id="editor-docs-list"></div>
                            <div class="editor-main">
                                <div class="input-group" style="margin-bottom:5px;"><input type="text" id="new-doc-title" placeholder="Neues Dokument..."><button class="btn-main active" onclick="addDocument()">+</button></div>
                                <textarea class="editor-textarea" id="editor-field" placeholder="Schreib hier etwas..." oninput="autoSaveText()"></textarea>
                            </div>
                        </div>`;
                } else {
                    let placeholderText = "Hinzufügen...";
                    if(c.id === 'project') placeholderText = "Neuer Meilenstein...";
                    if(c.id === 'ideas') placeholderText = "Kreative Idee...";
                    html += `<div class="input-group"><input type="text" id="input-${c.id}" placeholder="${placeholderText}"><button class="btn-main active" onclick="addItem('${c.id}')">+</button></div><ul class="list-container" id="list-${c.id}"></ul>`;
                }

                html += `</div>`;
                card.innerHTML = html;
                grid.appendChild(card);

                if(c.id === 'cal') { renderInnerCalendar(); } 
                else if(c.id === 'editor') { renderEditorWorkspace(); }
                else { populateList(c.id); }
            });

            setupDragAndDrop(grid);
        } catch(e) {
            console.error("Fehler beim Zeichnen des Dashboards:", e);
        }
    }

    function collapseCardAction(key) { collapsedCards[key] = true; renderAll(); }

    function setupDragAndDrop(grid) {
        const cards = grid.querySelectorAll('.card');
        let placeholder = document.createElement('div'); placeholder.className = 'card-placeholder';
        cards.forEach(card => {
            card.addEventListener('dragstart', (e) => { card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
            card.addEventListener('dragend', () => { card.classList.remove('dragging'); if(placeholder.parentNode) placeholder.parentNode.removeChild(placeholder); });
        });
        grid.addEventListener('dragover', (e) => {
            e.preventDefault(); const draggingCard = document.querySelector('.dragging'); if(!draggingCard) return;
            const afterElement = getDragAfterElement(grid, e.clientY);
            if (afterElement == null) { grid.appendChild(placeholder); grid.appendChild(draggingCard); } 
            else { grid.insertBefore(placeholder, afterElement); grid.insertBefore(draggingCard, placeholder); }
        });
    }

    function getDragAfterElement(grid, y) {
        const draggableElements = [...grid.querySelectorAll('.card:not(.dragging):not(.card-placeholder)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect(); const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) { return { offset: offset, element: child }; } else { return closest; }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function renderEditorWorkspace() {
        const person = familyData[activeMember];
        if (!person || !person.docs) return;
        const sidebar = document.getElementById('editor-docs-list');
        const textarea = document.getElementById('editor-field');
        if(!sidebar || !textarea) return;

        sidebar.innerHTML = "";
        person.docs.forEach((doc, idx) => {
            const btn = document.createElement('button');
            btn.className = `doc-tab ${idx === activeDocIndex ? 'active' : ''}`;
            btn.innerHTML = `<span>📄 ${doc.title || 'Unbenannt'}</span><span style="color:#e74c3c; font-size:0.75rem;" onclick="event.stopPropagation(); deleteDocument(${idx})">🗑️</span>`;
            btn.onclick = () => { activeDocIndex = idx; renderEditorWorkspace(); };
            sidebar.appendChild(btn);
        });

        if(person.docs[activeDocIndex]) {
            textarea.value = person.docs[activeDocIndex].text || "";
            textarea.disabled = false;
        } else {
            textarea.value = "Klicke links auf ein Dokument oder erstelle ein neues!";
            textarea.disabled = true;
        }
    }

    function addDocument() {
        const inp = document.getElementById('new-doc-title'); const title = inp.value.trim(); if(!title) return;
        const person = familyData[activeMember];
        if(!person.docs) person.docs = [];
        person.docs.push({title: title, text: ''});
        activeDocIndex = person.docs.length - 1; inp.value = ""; syncData();
    }

    function deleteDocument(idx) {
        if(confirm("Dieses Dokument unwiderruflich löschen?")) {
            familyData[activeMember].docs.splice(idx, 1);
            activeDocIndex = 0; if(familyData[activeMember].docs.length === 0) familyData[activeMember].docs = [{title: 'Notizen', text: ''}];
            syncData();
        }
    }

    function autoSaveText() {
        const textarea = document.getElementById('editor-field');
        if(!textarea || !familyData[activeMember] || !familyData[activeMember].docs || !familyData[activeMember].docs[activeDocIndex]) return;
        familyData[activeMember].docs[activeDocIndex].text = textarea.value;
        if(window.saveTimeout) clearTimeout(window.saveTimeout);
        window.saveTimeout = setTimeout(() => { syncData(); }, 1000);
    }

    function populateList(type) {
        const ul = document.getElementById(`list-${type}`); if(!ul) return;
        ul.innerHTML = "";
        const person = familyData[activeMember];
        if(!person) return;
        
        if(type === 'todo') {
            const arr = person.todos || [];
            arr.forEach((item, i) => {
                ul.innerHTML += `<li class="list-item"><span><input type="checkbox" ${item.completed?'checked':''} onchange="toggleTodoCheck(${i})"> <span style="${item.completed?'text-decoration:line-through;':''}">${item.title}</span></span><button class="btn-delete" onclick="deleteItemData('todos', ${i})">X</button></li>`;
            });
        } else {
            let dbKey = type === 'topics' ? 'topics' : (type === 'project' ? 'projects' : 'ideas');
            const arr = person[dbKey] || [];
            arr.forEach((item, i) => {
                ul.innerHTML += `<li class="list-item"><span class="clickable-text" onclick="openNotesPopup('${dbKey}', ${i})">🔹 <strong>${item.name}</strong> <small>(${item.notes?item.notes.length:0} Notizen)</small></span><button class="btn-delete" onclick="deleteItemData('${dbKey}', ${i})">X</button></li>`;
            });
        }
    }

    function addItem(type) {
        const val = document.getElementById(`input-${type}`).value.trim(); if(!val) return;
        const person = familyData[activeMember];
        if(type === 'todo') { if(!person.todos) person.todos = []; person.todos.push({title: val, completed: false}); }
        if(type === 'topics') { if(!person.topics) person.topics = []; person.topics.push({name: val, notes: []}); }
        if(type === 'project') { if(!person.projects) person.projects = []; person.projects.push({name: val, notes: []}); }
        if(type === 'ideas') { if(!person.ideas) person.ideas = []; person.ideas.push({name: val, notes: []}); }
        syncData();
        document.getElementById(`input-${type}`).value = "";
    }

    function toggleTodoCheck(i) { familyData[activeMember].todos[i].completed = !familyData[activeMember].todos[i].completed; syncData(); }
    function deleteItemData(key, i) { if(confirm("Eintrag löschen?")) { familyData[activeMember][key].splice(i,1); syncData(); } }

    let globalKey = "", globalIdx = 0;
    window.openNotesPopup = function(key, i) {
        globalKey = key; globalIdx = i; const item = familyData[activeMember][key][i];
        document.getElementById('modal-title').textContent = item.name; document.getElementById('notes-modal').style.display = 'flex';
        renderPopupNotesList();
    };
    function renderPopupNotesList() {
        const ul = document.getElementById('modal-notes-list'); ul.innerHTML = "";
        const item = familyData[activeMember][globalKey][globalIdx]; const notes = item.notes || [];
        if(notes.length === 0) ul.innerHTML = "<li>Keine Unterpunkte</li>";
        notes.forEach((n, ni) => { ul.innerHTML += `<li style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>• ${n}</span><button class="btn-delete" onclick="deletePopupNote(${ni})">X</button></li>`; });
    }
    window.addNote = function() {
        const inp = document.getElementById('note-input'); if(!inp.value.trim()) return;
        if(!familyData[activeMember][globalKey][globalIdx].notes) familyData[activeMember][globalKey][globalIdx].notes = [];
        familyData[activeMember][globalKey][globalIdx].notes.push(inp.value.trim()); inp.value = ""; syncData(); renderPopupNotesList();
    };
    window.deletePopupNote = function(ni) { familyData[activeMember][globalKey][globalIdx].notes.splice(ni,1); syncData(); renderPopupNotesList(); };

    function changeMonth(dir) { monthOffset += dir; renderAll(); }
    function renderInnerCalendar() {
        const grid = document.getElementById('inner-cal-grid'); const list = document.getElementById('inner-cal-list'); if(!grid) return; grid.innerHTML = ""; if(list) list.innerHTML = "";
        const now = new Date(); const firstDay = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1); const lastDay = new Date(now.getFullYear(), now.getMonth() + monthOffset + 1, 0);
        const titleLbl = document.getElementById('cal-title-lbl');
        if(titleLbl) titleLbl.textContent = firstDay.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
        let startShift = (firstDay.getDay() + 6) % 7;
        for(let i=0; i<startShift; i++) grid.innerHTML += `<div class="cal-cell" style="opacity:0.1;"></div>`;
        const personEvents = familyData[activeMember].events || [];
        for(let d=1; d<=lastDay.getDate(); d++) {
            const cellDate = new Date(now.getFullYear(), now.getMonth() + monthOffset, d); const dateStr = cellDate.toISOString().split('T')[0]; const isToday = cellDate.toDateString() === now.toDateString();
            const cell = document.createElement('div'); cell.className = `cal-cell ${isToday ? 'today' : ''}`; cell.innerHTML = `<div style="font-weight:bold; font-size:0.85rem;">${d}</div>`;
            cell.onclick = () => { document.getElementById('quick-event-date').value = dateStr; document.getElementById('quick-event-name').value=""; document.getElementById('event-modal').style.display='flex'; };
            personEvents.forEach((e, ei) => { if(e.start === dateStr) { cell.innerHTML += `<div class="cal-event" style="background:${e.color || '#3498db'};" onclick="event.stopPropagation(); if(confirm('Termin löschen?')) { familyData[activeMember].events.splice(${ei},1); syncData(); }">${e.name}</div>`; } });
            grid.appendChild(cell);
        }
    }

    function saveQuickEvent() {
        const name = document.getElementById('quick-event-name').value.trim(); const date = document.getElementById('quick-event-date').value; const color = document.getElementById('quick-event-color').value;
        if(!name) return; if(!familyData[activeMember].events) familyData[activeMember].events = [];
        familyData[activeMember].events.push({ name: name, start: date, color: color });
        syncData(); document.getElementById('event-modal').style.display = 'none';
    }

    function toggleSidebar() { const side = document.getElementById('app-sidebar'); if(!side) return; side.classList.toggle('collapsed'); const arrow = document.getElementById('side-arrow'); if(arrow) arrow.textContent = side.classList.contains('collapsed') ? "▶" : "◀"; }
    function quickToggleView() { config.view = config.view === 'normal' ? 'beta' : 'normal'; const setV = document.getElementById('set-view'); if(setV) setV.value = config.view; applyView(); }
    function applyView() { const setV = document.getElementById('set-view'); if(setV) config.view = setV.value; const vn = document.getElementById('view-normal'); if(vn) vn.style.display = config.view === 'normal' ? 'block' : 'none'; const vb = document.getElementById('view-beta'); if(vb) vb.style.display = config.view === 'beta' ? 'flex' : 'none'; const qxt = document.getElementById('quick-toggle-text'); if(qxt) qxt.textContent = config.view === 'normal' ? 'Wechsle zu Beta 1.12' : 'Wechsle zu Version 1.1'; renderAll(); }
    function applyGradient() { const setC = document.getElementById('set-color'); if(!setC) return; const grad = setC.value; config.gradient = grad; document.getElementById('app-body').style.setProperty('--header-gradient', grad); const extractedColor = grad.includes('f1c40f') ? '#e67e22' : (grad.includes('00f2fe') ? '#00f2fe' : '#8e44ad'); document.getElementById('app-body').style.setProperty('--primary-color', extractedColor); renderAll(); }
    function toggleDarkMode() { config.darkMode = !config.darkMode; document.getElementById('app-body').classList.toggle('dark-mode', config.darkMode); }
    function flipHeader() { document.querySelectorAll('.header-flip-element').forEach(el => el.classList.add('flipped')); setTimeout(() => document.querySelectorAll('.header-flip-element').forEach(el => el.classList.remove('flipped')), 4000); }
</script>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familien-Zentrum v1.17</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #3498db;
            --header-gradient: linear-gradient(135deg, #8e44ad, #3498db, #2ecc71);
            --border-radius: 16px;
            --shadow: 0 8px 15px rgba(0,0,0,0.05);
        }
        
        .dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; transition: background 0.2s, color 0.2s, width 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; overflow-x: hidden; }

        /* --- LOGIN & OVERLAYS --- */
        .login-overlay { position: fixed; inset: 0; background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); text-align: center; width: 90%; max-width: 400px; }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 2px solid #ddd; font-size: 1.3rem; text-align: center; outline: none; background: var(--card-bg); color: var(--text-color); }

        /* --- 3D FLIP HEADER (NUR IN V1.1) --- */
        .flip-container { perspective: 1500px; width: 100%; max-width: 1200px; margin: 20px auto; cursor: pointer; height: 140px; }
        .flipper { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s; }
        .flip-container.flipped .flipper { transform: rotateY(180deg); }
        .front, .back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; background: var(--header-gradient); background-size: 300% 300%; animation: gradShift 6s ease infinite; box-shadow: var(--shadow); }
        .back { transform: rotateY(180deg); background: #2c3e50; }
        @keyframes gradShift { 0% {background-position: 0% 50%} 50% {background-position: 100% 50%} 100% {background-position: 0% 50%} }

        /* --- LEUCHTENDE REINE SCHRIFT-UHR (FÜR BETA 1.12) --- */
        .glow-text-clock {
            font-size: 2.2rem;
            font-weight: 800;
            background: var(--header-gradient);
            background-size: 300% 300%;
            animation: gradShift 6s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 2px;
        }

        /* --- BUTTONS & KLEINE SKIPPER --- */
        .btn-main { padding: 12px 20px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; background: #e0e0e0; color: #333; font-size: 1rem; }
        .btn-main.active { background-color: var(--primary-color); color: white; }
        .dark-mode .btn-main { background: #333; color: #e0e0e0; }
        .dark-mode .btn-main.active { background-color: var(--primary-color); color: white; }
        
        /* Mini-Skipper für Kalenderwochen/Monate */
        .btn-skip-mini { padding: 4px 10px; font-size: 0.8rem; border-radius: 6px; border: none; background: rgba(0,0,0,0.08); color: var(--text-color); cursor: pointer; font-weight: bold; }
        .dark-mode .btn-skip-mini { background: rgba(255,255,255,0.1); }

        /* --- LAYOUTS --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; width: 100%; position: relative; }

        /* Beta Sidebar Layout */
        .beta-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
        .sidebar { width: 280px; background: var(--card-bg); border-right: 1px solid rgba(0,0,0,0.1); display: flex; flex-direction: column; padding: 20px; position: relative; box-shadow: var(--shadow); flex-shrink: 0; overflow-x: hidden; }
        .sidebar.collapsed { width: 0px; padding: 20px 0; border: none; }
        .sidebar .sidebar-content { display: flex; flex-direction: column; height: 100%; width: 240px; }
        .sidebar.collapsed .sidebar-content { display: none; }
        .main-view { flex: 1; overflow-y: auto; padding: 25px; width: 100%; }
        
        @media (max-width: 768px) {
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; z-index: 100; }
            .sidebar.collapsed { width: 0px; }
            .main-view { padding: 15px; }
        }

        /* --- CARDS --- */
        .card { background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; margin-bottom: 20px; border-top: 5px solid var(--primary-color); height: 560px; }
        .card-header { padding: 15px 20px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .card-body { padding: 20px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .btn-mini { border: none; background: rgba(0,0,0,0.05); cursor: pointer; padding: 6px; border-radius: 6px; font-size: 0.8rem; color: var(--text-color); }
        
        .card-mini-trigger { background: var(--primary-color); color: white; display: flex; justify-content: center; align-items: center; gap: 10px; padding: 12px 24px; border-radius: 30px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: var(--shadow); border: 2px solid var(--card-bg); margin-bottom: 15px; width: max-content; }

        /* --- LISTS & INPUTS --- */
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .input-group input, .input-group select { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; background: var(--card-bg); color: var(--text-color); }
        .input-group button { background-color: var(--primary-color); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .list-container { overflow-y: auto; flex: 1; list-style: none; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: rgba(0,0,0,0.02); border-radius: 6px; margin-bottom: 8px; border-left: 4px solid var(--primary-color); }
        .clickable-text { cursor: pointer; flex: 1; }
        .btn-delete { background: none; border: none; color: #e74c3c; cursor: pointer; padding: 2px 6px; font-weight: bold; }

        /* --- BIG CALENDAR (PC) --- */
        .big-calendar { background: var(--card-bg); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); width: 100%; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .cal-cell { background: rgba(0,0,0,0.02); min-height: 95px; padding: 8px; cursor: pointer; border-radius: 8px; border: 1px solid rgba(0,0,0,0.05); display: flex; flex-direction: column; gap: 4px; }
        .cal-cell:hover { background: rgba(0,0,0,0.05); }
        .cal-cell.today { background: rgba(52, 152, 219, 0.15); border: 2px solid var(--primary-color); }
        .cal-num { font-weight: bold; font-size: 0.9rem; }
        .cal-event { font-size: 0.75rem; padding: 2px 6px; color: white; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }

        /* --- MOBILE CALENDAR LIST --- */
        .mobile-cal-list { display: none; flex-direction: column; gap: 10px; margin-top: 15px; max-height: 500px; overflow-y: auto; }
        .mobile-cal-row { background: rgba(0,0,0,0.02); padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; border-left: 5px solid transparent; cursor: pointer; }
        .mobile-cal-row.today { background: rgba(52, 152, 219, 0.1); border-left-color: var(--primary-color); }
        .mobile-cal-date-label { font-weight: bold; font-size: 0.95rem; display: flex; justify-content: space-between; }
        .mobile-cal-events-container { display: flex; flex-direction: column; gap: 4px; }
        .mobile-cal-pill { padding: 6px 10px; color: white; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }

        @media (max-width: 768px) {
            .cal-grid { display: none !important; }
            .mobile-cal-list { display: flex !important; }
            .calendar-week-view { font-size: 0.75rem; gap: 2px !important; }
            .day-number { width: 22px !important; height: 22px !important; font-size: 0.75rem !important; }
        }

        .settings-modal { width: 90% !important; max-width: 750px !important; max-height: 85vh; overflow-y: auto; display: block !important; text-align: left; }
        .sidebar-toggle { position: absolute; top: 20px; right: 5px; background: var(--primary-color); color: white; border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 110; border: 2px solid var(--card-bg); font-weight: bold; box-shadow: var(--shadow); }
        
        .week-navigation-container { background-color: rgba(0,0,0,0.03); border-radius: 8px; padding: 10px; margin-bottom: 15px; }
        .calendar-week-view { display: grid; grid-template-columns: auto repeat(7, 1fr) auto; gap: 5px; text-align: center; align-items: center; }
        .day-number { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; margin: auto; font-size: 0.85rem; }
        .day-number.selected-day { border: 2px solid var(--text-color); }
        .day-preview-box { background-color: #fff9e6; color: #333; border-left: 4px solid #f1c40f; padding: 8px 12px; border-radius: 4px; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body id="app-body">

<div class="login-overlay" id="login-screen">
    <div class="login-box">
        <h2 style="margin-bottom:10px;">🔒 Familien-Zentrum</h2>
        <input type="password" id="pin-input" maxlength="4" placeholder="••••" onkeydown="if(event.key === 'Enter') checkPin()">
        <button class="btn-main active" style="width:100%" onclick="checkPin()">Einloggen</button>
        
        <button id="biometric-btn" class="btn-main" style="width:100%; margin-top:10px; display:none; background:#2ecc71; color:white;" onclick="loginWithBiometrics()">🧬 Mit Face ID / Touch ID entsperren</button>
        
        <p id="pin-error" style="color:#e74c3c; margin-top:10px; display:none; font-weight:bold;">Falscher PIN!</p>
    </div>
</div>

<div id="app-content" style="display:none">
    
    <div id="view-normal" class="container">
        <div class="flip-container header-flip-element" onclick="flipHeader()">
            <div class="flipper">
                <div class="front">
                    <h1 class="clock-display" style="font-size: 2.8rem;">00:00:00</h1>
                    <p class="date-display">Datum laden...</p>
                </div>
                <div class="back" onclick="event.stopPropagation()">
                    <h2>System Version 1.1</h2>
                    <button class="btn-main active" style="margin-top:10px;" onclick="openSettings()">⚙️ Einstellungen</button>
                </div>
            </div>
        </div>

        <div class="family-nav" id="person-nav-normal" style="margin-bottom:25px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;"></div>
        <h2 id="current-title-normal" style="text-align:center; margin-bottom:20px;">Dashboard</h2>
        
        <div id="expanded-calendar-normal" class="big-calendar" style="display:none; margin-bottom:30px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <button class="btn-skip-mini" onclick="changeMonth(-1)">◀</button>
                <h2 id="cal-month-name-normal">Monat</h2>
                <button class="btn-skip-mini" onclick="changeMonth(1)">▶</button>
                <button class="btn-main" onclick="toggleExpandCalendarNormal()">Collapse ↩</button>
            </div>
            <div class="cal-grid" id="cal-grid-body-normal"></div>
            <div class="mobile-cal-list" id="cal-list-body-normal"></div>
        </div>

        <div id="dashboard-normal" class="dashboard-grid"></div>
    </div>

    <div id="view-beta" class="beta-layout" style="display:none">
        <div class="sidebar-toggle" id="side-arrow" onclick="toggleSidebar()">◀</div>
        <div class="sidebar" id="app-sidebar">
            <div class="sidebar-content">
                <h2>Menu</h2>
                <hr style="margin:15px 0; opacity:0.2;">
                <div id="person-nav-beta" style="display:flex; flex-direction:column; gap:10px;"></div>
                <hr style="margin:15px 0; opacity:0.2;">
                <button class="btn-main" onclick="toggleDarkMode()">🌓 Dark Mode</button>
                <button class="btn-main" style="margin-top:10px;" onclick="openSettings()">⚙️ Einstellungen</button>
                <div id="beta-clock-small" style="margin-top:auto; text-align:center; font-weight:bold; font-size:1.2rem;">00:00</div>
            </div>
        </div>
        
        <div class="main-view">
            <div style="text-align:center; margin-bottom:25px;">
                <div class="glow-text-clock clock-display">00:00:00</div>
                <div class="date-display" style="opacity:0.7; font-size:1rem; font-weight:600;">Datum...</div>
                <h2 id="beta-title" style="font-size:2.2rem; margin-top:15px;">Dashboard</h2>
            </div>
            
            <div id="family-calendar-beta" class="big-calendar" style="display:none; margin-bottom:30px;">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                    <div>
                        <button class="btn-skip-mini" onclick="changeMonth(-1)">◀</button>
                        <span id="cal-month-name" style="font-weight:bold; margin:0 10px; font-size:1.2rem;">Monat</span>
                        <button class="btn-skip-mini" onclick="changeMonth(1)">▶</button>
                    </div>
                    <div style="display:flex; gap:5px;">
                        <button id="btn-view-month" class="btn-main active" onclick="setBetaCalScope('month')">Monat</button>
                        <button id="btn-view-week" class="btn-main" onclick="setBetaCalScope('week')">Woche</button>
                        <button class="btn-main" style="padding:6px 12px; font-size:0.9rem;" onclick="jumpToToday()">Heute</button>
                    </div>
                </div>
                <div class="cal-grid" id="cal-grid-body"></div>
                <div class="mobile-cal-list" id="cal-list-body"></div>
            </div>

            <div id="dashboard-beta" class="dashboard-grid"></div>
        </div>
    </div>
</div>

<div id="event-modal" class="login-overlay" style="display:none; background:rgba(0,0,0,0.6); z-index:4000;">
    <div class="login-box" style="text-align:left; max-width:450px;">
        <h3>📅 Neuen Termin eintragen</h3>
        <label>Datum:</label>
        <input type="date" id="quick-event-date">
        <input type="text" id="quick-event-name" placeholder="Name des Termins...">
        <label>Farbe auswählen:</label>
        <select id="quick-event-color" class="btn-main" style="width:100%; margin-top:5px; background:var(--card-bg);">
            <option value="#3498db">Standard Blau</option>
            <option value="#e67e22">Kürbis Orange</option>
            <option value="#2ecc71">Smaragd Grün</option>
            <option value="#e74c3c">Alarmsignal Rot</option>
            <option value="#9b59b6">Amethyst Violett</option>
            <option value="#1abc9c">Türkis See</option>
        </select>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-main active" style="flex:1;" onclick="saveQuickEvent()">Eintragen</button>
            <button class="btn-main" style="flex:1;" onclick="closeEventModal()">Abbrechen</button>
        </div>
    </div>
</div>

<div id="settings-modal" class="login-overlay" style="display:none; background:rgba(0,0,0,0.6)">
    <div class="login-box settings-modal">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #eee; padding-bottom:10px;">
            <h2>⚙️ Systemeinstellungen</h2>
            <button class="btn-main" onclick="closeSettings()">X</button>
        </div>
        <div style="margin-top:20px; display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:25px;">
            <div>
                <label style="font-weight:bold; display:block; margin-bottom:8px;">Version auswählen:</label>
                <select id="set-view" class="btn-main" style="width:100%; background:var(--card-bg);" onchange="applyView()">
                    <option value="normal">Version 1.1</option>
                    <option value="beta">Beta 1.12</option>
                </select>
                <br><br>
                <label style="font-weight:bold; display:block; margin-bottom:8px;">Uhr Farbverlauf:</label>
                <select id="set-color" class="btn-main" style="width:100%; background:var(--card-bg);" onchange="applyGradient()">
                    <option value="linear-gradient(135deg, #8e44ad, #3498db, #2ecc71)">Klassisch (Violett/Blau)</option>
                    <option value="linear-gradient(135deg, #f1c40f, #e67e22, #e74c3c)">Sunset (Orange/Rot)</option>
                    <option value="linear-gradient(135deg, #00cec9, #0984e3, #6c5ce7)">Ocean (Türkis/Blau)</option>
                </select>
                <br><br>
                <button id="register-bio-btn" class="btn-main" style="width:100%; background:#2ecc71; color:white; font-weight:bold;" onclick="registerBiometrics()">🧬 Face ID / Touch ID aktivieren</button>
            </div>
            <div style="background:rgba(0,0,0,0.03); padding:15px; border-radius:12px;">
                <label style="font-weight:bold; color:#e74c3c;">🔑 Sicherheits-PIN ändern:</label>
                <input type="password" id="pin-old" placeholder="Aktueller PIN">
                <input type="password" id="pin-new1" placeholder="Neuer PIN" maxlength="4">
                <input type="password" id="pin-new2" placeholder="Bestätigen" maxlength="4">
                <button class="btn-main active" style="width:100%; margin-top:5px;" onclick="updatePin()">PIN Speichern</button>
            </div>
        </div>
    </div>
</div>

<div id="notes-modal" class="login-overlay" style="display:none; background:rgba(0,0,0,0.5)">
    <div class="login-box" style="text-align:left;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="modal-title">Details</h3>
            <div style="display:flex; gap:5px;">
                <button id="modal-direct-delete-btn" class="btn-main" style="background:#e74c3c; color:white; padding:5px 10px; font-size:0.85rem;" onclick="deleteActiveItemDirectly()">🗑️ Löschen</button>
                <button class="btn-main" style="padding:5px 10px;" onclick="closeModal

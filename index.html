<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familien-Zentrum v1.13</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #3498db;
            --header-gradient: linear-gradient(135deg, #8e44ad, #3498db, #2ecc71);
            --border-radius: 16px;
            --shadow: 0 8px 15px rgba(0,0,0,0.05);
        }
        
        .dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; transition: background 0.2s, color 0.2s, width 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; }

        /* --- LOGIN & OVERLAYS --- */
        .login-overlay { position: fixed; inset: 0; background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); text-align: center; width: 90%; max-width: 400px; }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 2px solid #ddd; font-size: 1.3rem; text-align: center; outline: none; background: var(--card-bg); color: var(--text-color); }

        /* --- 3D FLIP HEADER --- */
        .flip-container { perspective: 1500px; width: 100%; max-width: 1200px; margin: 20px auto; cursor: pointer; height: 140px; }
        .flipper { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s; }
        .flip-container.flipped .flipper { transform: rotateY(180deg); }
        .front, .back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; background: var(--header-gradient); background-size: 300% 300%; animation: gradShift 6s ease infinite; box-shadow: var(--shadow); }
        .back { transform: rotateY(180deg); background: #2c3e50; }
        @keyframes gradShift { 0% {background-position: 0% 50%} 50% {background-position: 100% 50%} 100% {background-position: 0% 50%} }

        /* --- BUTTONS --- */
        .btn-main { padding: 12px 20px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; background: #e0e0e0; color: #333; font-size: 1rem; }
        .btn-main.active { background-color: var(--primary-color); color: white; }
        .dark-mode .btn-main { background: #333; color: #e0e0e0; }
        .dark-mode .btn-main.active { background-color: var(--primary-color); color: white; }

        /* --- LAYOUTS --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; width: 100%; position: relative; }

        /* Beta Sidebar Layout */
        .beta-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
        .sidebar { width: 280px; background: var(--card-bg); border-right: 1px solid rgba(0,0,0,0.1); display: flex; flex-direction: column; padding: 20px; position: relative; box-shadow: var(--shadow); }
        .sidebar.collapsed { width: 40px; padding: 20px 0; }
        .sidebar.collapsed * { display: none !important; }
        .sidebar.collapsed .sidebar-toggle { display: flex !important; right: -15px; }
        .main-view { flex: 1; overflow-y: auto; padding: 30px; }
        
        /* --- CARDS & MODIFIED HEADER LOGIC --- */
        .card { background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; margin-bottom: 20px; border-top: 5px solid var(--primary-color); height: 560px; }
        
        /* NEU: Symmetrischer Header für perfekte Ausrichtung */
        .card-header { padding: 15px 20px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; position: relative; }
        .card-header-left { flex: 1; font-weight: bold; text-align: left; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-header-center { flex: 0; position: absolute; left: 50%; transform: translateX(-50%); display: flex; justify-content: center; align-items: center; }
        .card-header-right { flex: 1; text-align: right; pointer-events: none; visibility: hidden; } /* Unsichtbarer Ausgleichs-Klon für perfekte Zentrierung */

        .btn-mini { border: none; background: rgba(0,0,0,0.05); cursor: pointer; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; color: var(--text-color); font-weight: bold; }
        .btn-mini:hover { background: rgba(0,0,0,0.1); }
        
        /* Ganz kleine Schaltfläche für eingeklappte Karte */
        .card-mini-container { display: flex; align-items: center; background: var(--card-bg); border-radius: 30px; padding: 5px 15px 5px 8px; box-shadow: var(--shadow); border: 2px solid var(--primary-color); margin-bottom: 15px; width: fit-content; gap: 10px; }
        .card-mini-trigger { width: 35px; height: 35px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .card-mini-text { font-size: 0.9rem; font-weight: bold; color: var(--text-color); }
        .card-mini-container:hover { transform: scale(1.02); }

        /* --- INPUT GROUPS & LISTS --- */
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .input-group input, .input-group select { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; background: var(--card-bg); color: var(--text-color); }
        .input-group button { background-color: var(--primary-color); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .list-container { overflow-y: auto; flex: 1; list-style: none; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: rgba(0,0,0,0.02); border-radius: 6px; margin-bottom: 8px; border-left: 4px solid var(--primary-color); }
        .clickable-text { cursor: pointer; flex: 1; }
        .btn-delete { background: none; border: none; color: #e74c3c; cursor: pointer; padding: 2px 6px; font-weight: bold; }

        /* --- BIG CALENDAR --- */
        .big-calendar { background: var(--card-bg); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); width: 100%; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .cal-cell { background: rgba(0,0,0,0.02); min-height: 95px; padding: 8px; cursor: pointer; border-radius: 8px; border: 1px solid rgba(0,0,0,0.05); display: flex; flex-direction: column; gap: 4px; }
        .cal-cell:hover { background: rgba(0,0,0,0.05); }
        .cal-cell.today { background: rgba(52, 152, 219, 0.15); border: 2px solid var(--primary-color); }
        .cal-num { font-weight: bold; font-size: 0.9rem; }
        .cal-event { font-size: 0.75rem; padding: 2px 6px; color: white; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; cursor: pointer; }
        .cal-event:hover { filter: brightness(0.9); }

        /* --- MODAL CONFIG & GRADIENTS --- */
        .settings-modal { width: 90% !important; max-width: 750px !important; max-height: 85vh; overflow-y: auto; display: block !important; text-align: left; }
        .beta-gradient-selection { background: linear-gradient(135deg, #ff7675, #6c5ce7) !important; color: white !important; font-weight: bold; }
        
        .sidebar-toggle { position: absolute; top: 20px; right: -15px; background: var(--primary-color); color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10; border: 2px solid var(--card-bg); font-weight: bold; }
        
        /* Wochenleiste Normalversion */
        .week-navigation-container { background-color: rgba(0,0,0,0.03); border-radius: 8px; padding: 10px; margin-bottom: 15px; }
        .calendar-week-view { display: grid; grid-template-columns: auto repeat(7, 1fr) auto; gap: 5px; text-align: center; align-items: center; }
        .day-number { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; margin: auto; font-size: 0.85rem; }
        .day-number.selected-day { border: 2px solid var(--text-color); }
        .day-preview-box { background-color: #fff9e6; color: #333; border-left: 4px solid #f1c40f; padding: 8px 12px; border-radius: 4px; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body id="app-body">

<div class="login-overlay" id="login-screen">
    <div class="login-box">
        <h2 style="margin-bottom:10px;">🔒 Familien-Zentrum</h2>
        <input type="password" id="pin-input" maxlength="4" placeholder="••••" onkeydown="if(event.key === 'Enter') checkPin()">
        <button class="btn-main active" style="width:100%" onclick="checkPin()">Einloggen</button>
        <p id="pin-error" style="color:#e74c3c; margin-top:10px; display:none; font-weight:bold;">Falscher PIN!</p>
    </div>
</div>

<div id="app-content" style="display:none">
    
    <div id="view-normal" class="container">
        <div class="flip-container" id="header-flip" onclick="flipHeader()">
            <div class="flipper">
                <div class="front">
                    <h1 id="clock" style="font-size: 2.8rem;">00:00:00</h1>
                    <p id="date">Datum laden...</p>
                </div>
                <div class="back" onclick="event.stopPropagation()">
                    <h2 id="system-version-title">System Version 1.1</h2>
                    <button class="btn-main active" style="margin-top:10px;" onclick="openSettings()">⚙️ Einstellungen</button>
                </div>
            </div>
        </div>

        <div class="family-nav" id="person-nav-normal" style="margin-bottom:25px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;"></div>
        <h2 id="current-title-normal" style="text-align:center; margin-bottom:20px;">Dashboard</h2>
        
        <div id="expanded-calendar-normal" class="big-calendar" style="display:none; margin-bottom:30px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <button class="btn-main" onclick="changeMonth(-1)">◀</button>
                <h2 id="cal-month-name-normal">Monat</h2>
                <button class="btn-main" onclick="toggleExpandCalendarNormal()">Collapse ↩</button>
            </div>
            <div class="cal-grid" id="cal-grid-body-normal"></div>
        </div>

        <div id="dashboard-normal" class="dashboard-grid"></div>
    </div>

    <div id="view-beta" class="beta-layout" style="display:none">
        <div class="sidebar" id="app-sidebar">
            <div class="sidebar-toggle" id="side-arrow" onclick="toggleSidebar()">◀</div>
            <h2>Menu</h2>
            <hr style="margin:15px 0; opacity:0.2;">
            <div id="person-nav-beta" style="display:flex; flex-direction:column; gap:10px;"></div>
            <hr style="margin:15px 0; opacity:0.2;">
            <button class="btn-main" onclick="toggleDarkMode()">🌓 Dark Mode</button>
            <button class="btn-main" style="margin-top:10px;" onclick="openSettings()">⚙️ Einstellungen</button>
            <div id="beta-clock-small" style="margin-top:auto; text-align:center; font-weight:bold; font-size:1.2rem;">00:00</div>
        </div>
        
        <div class="main-view">
            <div style="text-align:center; margin-bottom:25px;">
                <h2 id="beta-title" style="font-size:2rem;">Dashboard</h2>
                <div id="beta-date-top" style="opacity:0.6; font-size:0.9rem; margin-top:4px;">Datum</div>
            </div>
            
            <div id="family-calendar-beta" class="big-calendar" style="display:none; margin-bottom:30px;">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                    <div>
                        <button class="btn-main" onclick="changeMonth(-1)">◀</button>
                        <span id="cal-month-name" style="font-weight:bold; margin:0 10px; font-size:1.2rem;">Monat</span>
                        <button class="btn-main" onclick="changeMonth(1)">▶</button>
                    </div>
                    <div style="display:flex; gap:5px;">
                        <button id="btn-view-month" class="btn-main active" onclick="setBetaCalScope('month')">Monat</button>
                        <button id="btn-view-week" class="btn-main" onclick="setBetaCalScope('week')">Woche</button>
                        <button class="btn-main" onclick="jumpToToday()">Heute</button>
                    </div>
                </div>
                <div class="cal-grid" id="cal-grid-body"></div>
            </div>

            <div id="dashboard-beta" class="dashboard-grid"></div>
        </div>
    </div>
</div>

<div id="event-modal" class="login-overlay" style="display:none; background:rgba(0,0,0,0.6); z-index:4000;">
    <div class="login-box" style="text-align:left; max-width:450px;">
        <h3 style="margin-bottom:15px;">📅 Neuen Termin eintragen</h3>
        <label style="font-weight:bold; font-size:0.9rem;">Datum:</label>
        <input type="date" id="quick-event-date" style="font-size:1rem; padding:8px;">
        <input type="text" id="quick-event-name" placeholder="Name des Termins...">
        <label style="font-weight:bold; font-size:0.9rem;">Farbe auswählen:</label>
        <select id="quick-event-color" class="btn-main" style="width:100%; margin-top:5px; background:var(--card-bg); text-align:left;">
            <option value="#3498db" style="color:#3498db; font-weight:bold;">Standard Blau</option>
            <option value="#e67e22" style="color:#e67e22; font-weight:bold;">Kürbis Orange</option>
            <option value="#2ecc71" style="color:#2ecc71; font-weight:bold;">Smaragd Grün</option>
            <option value="#e74c3c" style="color:#e74c3c; font-weight:bold;">Alarmsignal Rot</option>
            <option value="#9b59b6" style="color:#9b59b6; font-weight:bold;">Amethyst Violett</option>
            <option value="#1abc9c" style="color:#1abc9c; font-weight:bold;">Türkis See</option>
            <option value="#f1c40f" style="color:#f1c40f; font-weight:bold;">Sonnengelb</option>
            <option value="#fd79a8" style="color:#fd79a8; font-weight:bold;">Zartrosa / Pink</option>
            <option value="#2ed573" style="color:#2ed573; font-weight:bold;">Limette</option>
            <option value="#74b9ff" style="color:#74b9ff; font-weight:bold;">Pastellblau</option>
            <option value="#6c5ce7" style="color:#6c5ce7; font-weight:bold;">Lavendel</option>
            <option value="#7f8c8d" style="color:#7f8c8d; font-weight:bold;">Schiefergrau</option>
        </select>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-main active" style="flex:1;" onclick="saveQuickEvent()">Eintragen</button>
            <button class="btn-main" style="flex:1;" onclick="closeEventModal()">Abbrechen</button>
        </div>
    </div>
</div>

<div id="settings-modal" class="login-overlay" style="display:none; background:rgba(0,0,0,0.6)">
    <div class="login-box settings-modal">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #eee; padding-bottom:10px;">
            <h2>⚙️ Systemeinstellungen</h2>
            <button class="btn-main" onclick="closeSettings()">X</button>
        </div>
        <div style="margin-top:20px; display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:25px;">
            <div>
                <label style="font-weight:bold; display:block; margin-bottom:8px;">Version auswählen:</label>
                <select id="set-view" class="btn-main" style="width:100%; background:var(--card-bg); text-align:left;" onchange="applyView()">
                    <option value="normal">Version 1.1</option>
                    <option value="beta">Beta 1.12</option>
                </select>
                <br><br>
                <label style="font-weight:bold; display:block; margin-bottom:8px;">Uhr Farbverlauf:</label>
                <select id="set-color" class="btn-main" style="width:100%; background:var(--card-bg); text-align:left;" onchange="applyGradient()">
                    <option value="linear-gradient(135deg, #8e44ad, #3498db, #2ecc71)">Klassisch (Violett/Blau)</option>
                    <option value="linear-gradient(135deg, #f1c40f, #e67e22, #e74c3c)">Sunset (Orange/Rot)</option>
                    <option value="linear-gradient(135deg, #00cec9, #0984e3, #6c5ce7)">Ocean (Türkis/Blau)</option>
                    <option value="beta-special" id="opt-beta-special" style="display:none;">Beta 1.12 Gradient (Red/Purple)</option>
                </select>
            </div>
            <div style="background:rgba(0,0,0,0.03); padding:15px; border-radius:12px;">
                <label style="font-weight:bold; color:#e74c3c;">🔑 Sicherheits-PIN ändern:</label>
                <input type="password" id="pin-old" placeholder="Aktueller PIN">
                <input type="password" id="pin-new1" placeholder="Neuer PIN" maxlength="4">
                <input type="password" id="pin-new2" placeholder="Bestätigen" maxlength="4">
                <button class="btn-main active" style="width:100%; margin-top:5px;" onclick="updatePin()">PIN Speichern</button>
            </div>
        </div>
    </div>
</div>

<div id="notes-modal" class="login-overlay" style="display:none; background:rgba(0,0,0,0.5)">
    <div class="login-box" style="text-align:left;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;"><h3 id="modal-title">Details</h3><button class="btn-main" onclick="closeModal()">X</button></div>
        <ul id="modal-notes-list" style="list-style:none; max-height:200px; overflow-y:auto; margin-bottom:15px;"></ul>
        <div class="input-group"><input type="text" id="note-input" placeholder="Notiz hinzufügen..."><button onclick="addNote()">Merken</button></div>
    </div>
</div>

<script>
    // --- VARIABLES & SETUP ---
    let GEHEIMER_PIN = "1234";
    let activeMember = "Lukas";
    let config = { view: 'normal', gradient: 'linear-gradient(135deg, #8e44ad, #3498db, #2ecc71)', darkMode: false };
    let familyData = { Lukas: { topics: [], todos: [] }, Kathrin: { topics: [], todos: [] }, Marlene: { topics: [], todos: [] }, Anna: { todos: [] }, Robert: { todos: [] }, Familie: { events: [], todos: [] } };
    
    let collapsedCards = {}; 
    let monthOffset = 0;
    let weekOffset = 0;
    let betaCalScope = "month";
    let showExpandedNormalCal = false;
    let currentWeekDates = [];
    let selectedDayIndex = null;
    let activeItemIndex = null;
    let flipTimer = null;

    const firebaseConfig = {
        apiKey: "AIzaSyAxam2TnWekNHYsKGfVfYoFEz2Jo-QZjEs",
        authDomain: "dashboard-4dacb.firebaseapp.com",
        databaseURL: "https://dashboard-4dacb-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "dashboard-4dacb",
        storageBucket: "dashboard-4dacb.appspot.com",
        appId: "1:252785957836:web:498c30a1eb9e7a6b72db69"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function checkPin() {
        if(document.getElementById('pin-input').value === GEHEIMER_PIN) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            initApp();
        } else { document.getElementById('pin-error').style.display = 'block'; }
    }

    function initApp() {
        database.ref('familyZentrumConfig/pin').on('value', (s) => { if(s.val()) GEHEIMER_PIN = s.val(); });
        database.ref('familyZentrumData').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                Object.keys(familyData).forEach(m => {
                    if(data[m]) {
                        familyData[m].todos = data[m].todos || [];
                        familyData[m].topics = data[m].topics || [];
                        familyData[m].events = data[m].events || [];
                    }
                });
            }
            renderAll();
        });
        updateClock(); setInterval(updateClock, 1000); applyGradient(); switchMember(activeMember);
    }

    function updateClock() {
        const now = new Date(); const time = now.toLocaleTimeString('de-DE');
        document.getElementById('clock').textContent = time;
        document.getElementById('beta-clock-small').textContent = time.substring(0,5);
        document.getElementById('date').textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
        document.getElementById('beta-date-top').textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    function syncData() { database.ref('familyZentrumData').set(familyData); }
    function toggleSidebar() { const side = document.getElementById('app-sidebar'); side.classList.toggle('collapsed'); document.getElementById('side-arrow').textContent = side.classList.contains('collapsed') ? "▶" : "◀"; }
    function switchMember(name) { activeMember = name; selectedDayIndex = null; renderNavButtons(); renderAll(); }

    function renderNavButtons() {
        const list = ["Lukas", "Kathrin", "Marlene", "Anna", "Robert", "Familie"];
        ["person-nav-normal", "person-nav-beta"].forEach(id => {
            const cont = document.getElementById(id); if(!cont) return; cont.innerHTML = "";
            list.forEach(m => {
                const b = document.createElement('button'); b.className = `btn-main ${m === activeMember ? 'active' : ''}`; b.textContent = m; b.onclick = () => switchMember(m); cont.appendChild(b);
            });
        });
    }

    // --- PIPELINE OVERVIEW ---
    function renderAll() {
        renderNavButtons();
        const isBeta = config.view === 'beta';
        const grid = document.getElementById(isBeta ? 'dashboard-beta' : 'dashboard-normal');
        document.getElementById('dashboard-normal').innerHTML = "";
        document.getElementById('dashboard-beta').innerHTML = "";
        
        // Dynamic Calendar Load
        const bigCalBeta = document.getElementById('family-calendar-beta');
        if(activeMember === 'Familie' && isBeta) { bigCalBeta.style.display = 'block'; renderBigCalendar('cal-grid-body', 'cal-month-name', betaCalScope); } else { bigCalBeta.style.display = 'none'; }
        
        const bigCalNormal = document.getElementById('expanded-calendar-normal');
        if(activeMember === 'Familie' && !isBeta && showExpandedNormalCal) { bigCalNormal.style.display = 'block'; renderBigCalendar('cal-grid-body-normal', 'cal-month-name-normal', 'month'); } else { bigCalNormal.style.display = 'none'; }

        const structures = [
            { id: 'topics', title: activeMember === 'Familie' ? 'Kalender Termine' : 'Lernthemen', show: activeMember !== 'Anna' && activeMember !== 'Robert' },
            { id: 'todo-open', title: 'To-Do: Offen', show: true },
            { id: 'todo-done', title: 'Erledigt', show: true }
        ];

        structures.forEach(s => {
            if(!s.show) return;
            const cardKey = s.id + activeMember;
            
            // ULTRA-MINIMALER RUNDER TRIGGER-BUTTON WENN GEKAPPT MIT LINKER TEXT-ANZEIGE
            if(collapsedCards[cardKey]) {
                const miniContainer = document.createElement('div');
                miniContainer.className = "card-mini-container";
                
                const textLabel = document.createElement('span');
                textLabel.className = "card-mini-text";
                textLabel.textContent = s.title;

                const miniTrigger = document.createElement('div');
                miniTrigger.className = "card-mini-trigger";
                miniTrigger.textContent = "+";
                miniTrigger.onclick = () => toggleCardBody(s.id);
                
                miniContainer.appendChild(miniTrigger);
                miniContainer.appendChild(textLabel);
                grid.appendChild(miniContainer);
                return;
            }
            
            const card = document.createElement('div');
            card.className = "card";
            
            // NEU: Vollständig ausbalancierter Header mit zentriertem Button
            let headerHtml = `
                <div class="card-header">
                    <div class="card-header-left">${s.title} ist geöffnet</div>
                    <div class="card-header-center">
                        <button class="btn-mini" onclick="toggleCardBody('${s.id}')">➖ Zuklappen</button>
                    </div>
                    <div class="card-header-right">${s.title} ist geöffnet</div>
                </div>`;
            let bodyHtml = `<div class="card-body">`;
            
            if(s.id === 'topics' && !isBeta) {
                if(activeMember === 'Familie') {
                    bodyHtml += `
                        <div class="week-navigation-container">
                            <div class="calendar-week-view">
                                <button class="btn-main" style="padding:2px 8px;" onclick="changeWeek(-1); event.stopPropagation();">◀</button>
                                <div onclick="selectDay(0)">MO<div class="day-number" id="wd-0">-</div></div>
                                <div onclick="selectDay(1)">DI<div class="day-number" id="wd-1">-</div></div>
                                <div onclick="selectDay(2)">MI<div class="day-number" id="wd-2">-</div></div>
                                <div onclick="selectDay(3)">DO<div class="day-number" id="wd-3">-</div></div>
                                <div onclick="selectDay(4)">FR<div class="day-number" id="wd-4">-</div></div>
                                <div onclick="selectDay(5)">SA<div class="day-number" id="wd-5">-</div></div>
                                <div onclick="selectDay(6)">SO<div class="day-number" id="wd-6">-</div></div>
                                <button class="btn-main" style="padding:2px 8px;" onclick="changeWeek(1); event.stopPropagation();">▶</button>
                            </div>
                        </div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <button class="btn-main" onclick="toggleExpandCalendarNormal()">🔍 Vergrößern (Monat)</button>
                        </div>
                        <div class="day-preview-box" id="day-preview-container" style="display:none;"><div id="day-preview-text">Keine Termine</div></div>
                        <div class="input-group" style="flex-direction:column; gap:5px;">
                            <input type="text" id="event-input" placeholder="Termin-Name...">
                            <input type="date" id="event-start">
                            <label style="font-size:0.8rem; font-weight:bold;">Farbe:</label>
                            <select id="event-color-normal" class="btn-main" style="padding:5px; font-size:0.9rem;">
                                <option value="#3498db">Blau</option><option value="#e67e22">Orange</option>
                                <option value="#2ecc71">Grün</option><option value="#e74c3c">Rot</option>
                                <option value="#9b59b6">Violett</option><option value="#fd79a8">Pink</option>
                            </select>
                            <button class="btn-main active" onclick="addEvent()">Termin eintragen</button>
                        </div>`;
                } else { bodyHtml += `<div class="input-group"><input type="text" id="topic-input" placeholder="Neues Thema..."><button class="btn-main active" onclick="addTopic()">+</button></div>`; }
            } else if (s.id === 'todo-open') { bodyHtml += `<div class="input-group"><input type="text" id="todo-input" placeholder="Aufgabe..."><button class="btn-main active" onclick="addTodo()">+</button></div>`; }

            bodyHtml += `<ul class="list-container" id="list-${s.id}"></ul></div>`;
            card.innerHTML = headerHtml + bodyHtml;
            grid.appendChild(card);
        });
        fillLists();
    }

    function toggleCardBody(id) { collapsedCards[id + activeMember] = !collapsedCards[id + activeMember]; renderAll(); }
    function toggleExpandCalendarNormal() { showExpandedNormalCal = !showExpandedNormalCal; renderAll(); }
    
    function setBetaCalScope(scope) {
        betaCalScope = scope;
        document.getElementById('btn-view-month').classList.toggle('active', scope === 'month');
        document.getElementById('btn-view-week').classList.toggle('active', scope === 'week');
        renderBigCalendar('cal-grid-body', 'cal-month-name', scope);
    }

    // --- FLEXIBLE CALENDAR BUILDER ---
    function renderBigCalendar(targetGridId, targetTitleId, scope) {
        const grid = document.getElementById(targetGridId); grid.innerHTML = "";
        const now = new Date();
        
        if (scope === "month") {
            const firstDay = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
            const lastDay = new Date(now.getFullYear(), now.getMonth() + monthOffset + 1, 0);
            document.getElementById(targetTitleId).textContent = firstDay.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
            
            let startShift = (firstDay.getDay() + 6) % 7;
            for(let i=0; i<startShift; i++) grid.innerHTML += `<div class="cal-cell" style="opacity:0.2;"></div>`;

            for(let d=1; d<=lastDay.getDate(); d++) {
                const cellDate = new Date(now.getFullYear(), now.getMonth() + monthOffset, d);
                buildCalCell(grid, cellDate, d, now);
            }
        } else if (scope === "week") {
            const currentDay = now.getDay();
            const distanceToMonday = currentDay === 0 ? -6 : 1 - currentDay;
            const monday = new Date(now); monday.setDate(now.getDate() + distanceToMonday + (monthOffset * 7));
            const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
            document.getElementById(targetTitleId).textContent = `KW ${getWeekNumber(monday)} (${monday.getDate()}.${monday.getMonth()+1}. - ${sunday.getDate()}.${sunday.getMonth()+1}.)`;

            for(let i=0; i<7; i++) {
                let cellDate = new Date(monday); cellDate.setDate(monday.getDate() + i);
                const dayLabel = cellDate.toLocaleDateString('de-DE', {weekday: 'short'});
                buildCalCell(grid, cellDate, `${dayLabel} ${cellDate.getDate()}`, now);
            }
        }
    }

    function buildCalCell(grid, cellDate, label, now) {
        const dateStr = cellDate.toISOString().split('T')[0];
        const isToday = cellDate.toDateString() === now.toDateString();
        const cell = document.createElement('div');
        cell.className = `cal-cell ${isToday ? 'today' : ''}`;
        cell.innerHTML = `<div class="cal-num">${label}</div>`;
        cell.onclick = () => openQuickEventModal(dateStr);
        
        (familyData.Familie.events || []).forEach((e, idx) => {
            if(dateStr === e.start) {
                // NEU: onclick="deleteEventDirect(${idx})" ermoeglicht das Löschen beim Draufklicken
                cell.innerHTML += `<div class="cal-event" style="background:${e.color || '#3498db'};" onclick="event.stopPropagation(); deleteEventDirect(${idx});">${e.name}</div>`;
            }
        });
        grid.appendChild(cell);
    }

    function getWeekNumber(d) { d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7)); var s = new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.ceil((((d - s) / 86400000) + 1)/7); }

    // --- RENDERING LIST ITEMS & SYNCS ---
    function fillLists() {
        const data = familyData[activeMember]; 
        const leftList = document.getElementById('list-topics');
        if(leftList) {
            leftList.innerHTML = ""; // Behebt das Duplizierungsrisiko
            if(activeMember === 'Familie') {
                updateNormalWeekBar();
                (data.events || []).forEach((e, i) => { leftList.innerHTML += `<li class="list-item"><span class="clickable-text" onclick="openNotes(${i})"><strong>${e.name}</strong> <small>(${new Date(e.start).toLocaleDateString('de-DE')})</small></span><button class="btn-delete" onclick="deleteEvent(${i})">X</button></li>`; });
            } else {
                (data.topics || []).forEach((t, i) => { leftList.innerHTML += `<li class="list-item"><span class="clickable-text" onclick="openNotes(${i})">${t.name} <small>(${t.notes?t.notes.length:0} Infos)</small></span><button class="btn-delete" onclick="deleteTopic(${i})">X</button></li>`; });
            }
        }
        
        const oList = document.getElementById('list-todo-open'); 
        const dList = document.getElementById('list-todo-done');
        if(oList) oList.innerHTML = "";
        if(dList) dList.innerHTML = "";
        
        (data.todos || []).forEach((todo, i) => {
            if(!todo.done && oList) {
                oList.innerHTML += `<li class="list-item"><span>${todo.name}</span><div><button class="btn-mini" onclick="toggleTodo(${i})">✓</button><button class="btn-delete" onclick="deleteTodo(${i})">X</button></div></li>`;
            } else if(todo.done && dList) {
                dList.innerHTML += `<li class="list-item" style="opacity:0.5; text-decoration:line-through;"><span>${todo.name}</span><div><button class="btn-mini" onclick="toggleTodo(${i})">↩</button><button class="btn-delete" onclick="deleteTodo(${i})">X</button></div></li>`;
            }
        });
    }

    // --- EVENT / DATA MANIPULATION FUNCTIONS ---
    function addEvent() {
        const name = document.getElementById('event-input').value;
        const start = document.getElementById('event-start').value;
        const color = document.getElementById('event-color-normal').value;
        if(!name || !start) return;
        if(!familyData.Familie.events) familyData.Familie.events = [];
        familyData.Familie.events.push({ name, start, color, notes: [] });
        document.getElementById('event-input').value = "";
        syncData();
    }

    // NEU: Funktion zum direkten Löschen eines Termins beim Klick auf das Kalenderelement
    function deleteEventDirect(idx) {
        const e = familyData.Familie.events[idx];
        if(confirm(`Möchtest du den Termin "${e.name}" wirklich direkt löschen?`)) {
            deleteEvent(idx);
        }
    }

    function deleteEvent(idx) {
        familyData.Familie.events.splice(idx, 1);
        syncData();
    }

    function addTopic() {
        const input = document.getElementById('topic-input'); if(!input || !input.value) return;
        familyData[activeMember].topics.push({ name: input.value, notes: [] });
        input.value = ""; syncData();
    }
    function deleteTopic(i) { familyData[activeMember].topics.splice(i, 1); syncData(); }

    function addTodo() {
        const input = document.getElementById('todo-input'); if(!input || !input.value) return;
        familyData[activeMember].todos.push({ name: input.value, done: false });
        input.value = ""; syncData();
    }
    function toggleTodo(i) { familyData[activeMember].todos[i].done = !familyData[activeMember].todos[i].done; syncData(); }
    function deleteTodo(i) { familyData[activeMember].todos.splice(i, 1); syncData(); }

    // --- QUICK WINDOW & NAVIGATION ---
    function openQuickEventModal(dateStr) {
        document.getElementById('quick-event-date').value = dateStr;
        document.getElementById('quick-event-name').value = "";
        document.getElementById('event-modal').style.display = 'flex';
    }
    function closeEventModal() { document.getElementById('event-modal').style.display = 'none'; }
    function saveQuickEvent() {
        const name = document.getElementById('quick-event-name').value;
        const start = document.getElementById('quick-event-date').value;
        const color = document.getElementById('quick-event-color').value;
        if(!name || !start) return;
        if(!familyData.Familie.events) familyData.Familie.events = [];
        familyData.Familie.events.push({ name, start, color, notes: [] });
        closeEventModal(); syncData();
    }

    function changeMonth(dir) { monthOffset += dir; renderAll(); }
    function jumpToToday() { monthOffset = 0; renderAll(); }

    function updateNormalWeekBar() {
        const now = new Date();
        const currentDay = now.getDay();
        const distanceToMonday = currentDay === 0 ? -6 : 1 - currentDay;
        const monday = new Date(now); monday.setDate(now.getDate() + distanceToMonday + (weekOffset * 7));
        currentWeekDates = [];
        for(let i=0; i<7; i++) {
            let d = new Date(monday); d.setDate(monday.getDate() + i);
            currentWeekDates.push(d.toISOString().split('T')[0]);
            const numEl = document.getElementById(`wd-${i}`);
            if(numEl) {
                numEl.textContent = d.getDate();
                numEl.classList.toggle('selected-day', i === selectedDayIndex);
            }
        }
    }
    function changeWeek(dir) { weekOffset += dir; selectedDayIndex = null; document.getElementById('day-preview-container').style.display='none'; renderAll(); }
    function selectDay(idx) {
        selectedDayIndex = idx;
        updateNormalWeekBar();
        const targetDate = currentWeekDates[idx];
        const dayEvents = (familyData.Familie.events || []).filter(e => e.start === targetDate);
        const box = document.getElementById('day-preview-container');
        const text = document.getElementById('day-preview-text');
        box.style.display = 'block';
        if(dayEvents.length > 0) {
            text.innerHTML = dayEvents.map(e => `<span style="color:${e.color}; font-weight:bold;">•</span> ${e.name}`).join('<br>');
        } else { text.textContent = "Keine Termine"; }
    }

    // --- MODALS & EXTENDED SYSTEMS ---
    function openNotes(idx) {
        activeItemIndex = idx;
        const modal = document.getElementById('notes-modal');
        const title = document.getElementById('modal-title');
        const list = document.getElementById('modal-notes-list');
        list.innerHTML = "";
        modal.style.display = 'flex';
        
        if(activeMember === 'Familie') {
            const e = familyData.Familie.events[idx];
            title.textContent = e.name;
            if(!e.notes) e.notes = [];
            e.notes.forEach((n, i) => { list.innerHTML += `<li>${n} <button class="btn-delete" onclick="deleteNote(${i})">X</button></li>`; });
        } else {
            const t = familyData[activeMember].topics[idx];
            title.textContent = t.name;
            if(!t.notes) t.notes = [];
            t.notes.forEach((n, i) => { list.innerHTML += `<li>${n} <button class="btn-delete" onclick="deleteNote(${i})">X</button></li>`; });
        }
    }
    function closeModal() { document.getElementById('notes-modal').style.display = 'none'; }
    function addNote() {
        const input = document.getElementById('note-input'); if(!input || !input.value) return;
        if(activeMember === 'Familie') {
            if(!familyData.Familie.events[activeItemIndex].notes) familyData.Familie.events[activeItemIndex].notes = [];
            familyData.Familie.events[activeItemIndex].notes.push(input.value);
        } else {
            if(!familyData[activeMember].topics[activeItemIndex].notes) familyData[activeMember].topics[activeItemIndex].notes = [];
            familyData[activeMember].topics[activeItemIndex].notes.push(input.value);
        }
        input.value = ""; syncData(); openNotes(activeItemIndex);
    }
    function deleteNote(i) {
        if(activeMember === 'Familie') { familyData.Familie.events[activeItemIndex].notes.splice(i,1); }
        else { familyData[activeMember].topics[activeItemIndex].notes.splice(i,1); }
        syncData(); openNotes(activeItemIndex);
    }

    // --- CONFIG SYSTEM ---
    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
    
    function applyView() {
        const val = document.getElementById('set-view').value;
        config.view = val;
        document.getElementById('view-normal').style.display = val === 'normal' ? 'block' : 'none';
        document.getElementById('view-beta').style.display = val === 'beta' ? 'flex' : 'none';
        
        // NEU: Schaltet die Gradientenoptionen und Titel fuer Version 1.12 frei
        const optBeta = document.getElementById('opt-beta-special');
        if(val === 'beta') {
            optBeta.style.display = 'block';
            document.getElementById('system-version-title').textContent = "System Version 1.12 (Beta Layout)";
        } else {
            optBeta.style.display = 'none';
            document.getElementById('system-version-title').textContent = "System Version 1.1";
            if(document.getElementById('set-color').value === 'beta-special') {
                document.getElementById('set-color').value = 'linear-gradient(135deg, #8e44ad, #3498db, #2ecc71)';
            }
        }
        renderAll();
    }

    function applyGradient() {
        let val = document.getElementById('set-color').value;
        // NEU: Aktiviert den speziellen Farbverlauf fuer Version 1.12
        if(val === 'beta-special') {
            val = 'linear-gradient(135deg, #ff7675, #6c5ce7)';
        }
        config.gradient = val;
        document.documentElement.style.setProperty('--header-gradient', val);
    }

    function toggleDarkMode() {
        config.darkMode = !config.darkMode;
        document.body.classList.toggle('dark-mode', config.darkMode);
    }

    function updatePin() {
        const oldP = document.getElementById('pin-old').value;
        const n1 = document.getElementById('pin-new1').value;
        const n2 = document.getElementById('pin-new2').value;
        if(oldP !== GEHEIMER_PIN) { alert("Alter PIN falsch!"); return; }
        if(n1 !== n2 || n1.length !== 4) { alert("Neue PINs stimmen nicht überein oder sind nicht 4-stellig!"); return; }
        database.ref('familyZentrumConfig/pin').set(n1).then(() => {
            alert("PIN erfolgreich geändert!");
            document.getElementById('pin-old').value = "";
            document.getElementById('pin-new1').value = "";
            document.getElementById('pin-new2').value = "";
        });
    }

    function flipHeader() { document.getElementById('header-flip').classList.toggle('flipped'); }
</script>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familien-Zentrum v1.31</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #3498db;
            --header-gradient: linear-gradient(135deg, #8e44ad, #3498db, #2ecc71);
            --border-radius: 16px;
            --shadow: 0 8px 15px rgba(0,0,0,0.05);
        }
        
        .dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; transition: background 0.2s, color 0.2s, width 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; overflow-x: hidden; }

        /* --- QUICK VERSION TOGGLE (OBEN RECHTS) --- */
        .quick-version-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 4500;
            background: var(--header-gradient);
            color: white;
            border: 2px solid var(--card-bg);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .quick-version-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* --- LOGIN --- */
        .login-overlay { position: fixed; inset: 0; background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); text-align: center; width: 90%; max-width: 400px; }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 2px solid #ddd; font-size: 1.3rem; text-align: center; outline: none; background: var(--card-bg); color: var(--text-color); }

        /* --- 3D FLIP HEADER --- */
        .flip-container { perspective: 1500px; width: 100%; max-width: 1200px; margin: 20px auto; cursor: pointer; height: 140px; }
        .flipper { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s; }
        .flip-container.flipped .flipper { transform: rotateY(180deg); }
        .front, .back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; background: var(--header-gradient); background-size: 300% 300%; animation: gradShift 6s ease infinite; box-shadow: var(--shadow); }
        .back { transform: rotateY(180deg); background: #2c3e50; }
        @keyframes gradShift { 0% {background-position: 0% 50%} 50% {background-position: 100% 50%} 100% {background-position: 0% 50%} }

        /* --- SCHRIFT-UHR --- */
        .glow-text-clock {
            font-size: 2.2rem;
            font-weight: 800;
            background: var(--header-gradient);
            background-size: 300% 300%;
            animation: gradShift 6s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 2px;
        }

        /* --- BUTTONS --- */
        .btn-main { padding: 12px 20px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; background: #e0e0e0; color: #333; font-size: 1rem; }
        .btn-main.active { background-color: var(--primary-color); color: white; }
        .dark-mode .btn-main { background: #333; color: #e0e0e0; }
        .dark-mode .btn-main.active { background-color: var(--primary-color); color: white; }
        .btn-skip-mini { padding: 4px 10px; font-size: 0.8rem; border-radius: 6px; border: none; background: rgba(0,0,0,0.08); color: var(--text-color); cursor: pointer; font-weight: bold; }
        .dark-mode .btn-skip-mini { background: rgba(255,255,255,0.1); }

        /* --- LAYOUTS --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; width: 100%; position: relative; transition: all 0.3s ease; }

        .minimized-dock { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; width: 100%; min-height: 0px; }

        .beta-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
        .sidebar { width: 280px; background: var(--card-bg); border-right: 1px solid rgba(0,0,0,0.1); display: flex; flex-direction: column; padding: 20px; position: relative; box-shadow: var(--shadow); flex-shrink: 0; overflow-x: hidden; }
        .sidebar.collapsed { width: 0px; padding: 20px 0; border: none; }
        .sidebar .sidebar-content { display: flex; flex-direction: column; height: 100%; width: 240px; }
        .sidebar.collapsed .sidebar-content { display: none; }
        .main-view { flex: 1; overflow-y: auto; padding: 25px; width: 100%; }
        
        @media (max-width: 768px) {
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; z-index: 100; }
            .sidebar.collapsed { width: 0px; }
            .main-view { padding: 15px; }
            .quick-version-toggle { top: auto; bottom: 15px; right: 15px; } /* Auf Handys unten rechts, um nicht zu stören */
        }

        /* --- CARDS MIT DRAG & RESIZE --- */
        .card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            box-shadow: var(--shadow); 
            display: flex; 
            flex-direction: column; 
            margin-bottom: 20px; 
            border-top: 5px solid var(--primary-color); 
            height: 560px;
            resize: both; 
            overflow: auto; 
            opacity: 1;
            transform: scale(1);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        
        .card.dragging {
            opacity: 0.4;
            transform: scale(0.98);
            border: 2px dashed var(--primary-color);
        }

        .card-header { 
            padding: 15px 20px; 
            border-bottom: 1px solid rgba(0,0,0,0.05); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: move; 
            user-select: none;
        }
        .card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; overflow: auto; }
        .btn-mini { border: none; background: rgba(0,0,0,0.05); cursor: pointer; padding: 6px; border-radius: 6px; font-size: 0.8rem; color: var(--text-color); }
        
        .card-mini-floating { 
            background: var(--card-bg); 
            color: var(--text-color); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 10px 20px; 
            border-radius: 30px; 
            font-size: 0.9rem; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: var(--shadow); 
            border-left: 4px solid var(--primary-color);
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .card-mini-floating:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card-mini-floating b { background: rgba(0,0,0,0.05); width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 0.8rem; }
        .dark-mode .card-mini-floating b { background: rgba(255,255,255,0.1); }

        @keyframes popIn {
            from { transform: scale(0.6) translateY(-20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* --- LISTS & INPUTS --- */
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .input-group input, .input-group select { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; background: var(--card-bg); color: var(--text-color); }
        .input-group button { background-color: var(--primary-color); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .list-container { overflow-y: auto; flex: 1; list-style: none; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: rgba(0,0,0,0.02); border-radius: 6px; margin-bottom: 8px; border-left: 4px solid var(--primary-color); }
        .clickable-text { cursor: pointer; flex: 1; }
        .btn-delete { background: none; border: none; color: #e74c3c; cursor: pointer; padding: 2px 6px; font-weight: bold; }

        /* --- BIG CALENDAR --- */
        .big-calendar { background: var(--card-bg); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); width: 100%; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .cal-cell { background: rgba(0,0,0,0.02); min-height: 95px; padding: 8px; cursor: pointer; border-radius: 8px; border: 1px solid rgba(0,0,0,0.05); display: flex; flex-direction: column; gap: 4px; }
        .cal-cell:hover { background: rgba(0,0,0,0.05); }
        .cal-cell.today { background: rgba(52, 152, 219, 0.15); border: 2px solid var(--primary-color); }
        .cal-num { font-weight: bold; font-size: 0.9rem; }
        .cal-event { font-size: 0.75rem; padding: 2px 6px; color: white; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }

        /* --- MOBILE CALENDAR --- */
        .mobile-cal-list { display: none; flex-direction: column; gap: 10px; margin-top: 15px; max-height: 500px; overflow-y: auto; }
        .mobile-cal-row { background: rgba(0,0,0,0.02); padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; border-left: 5px solid transparent; cursor: pointer; }
        .mobile-cal-row.today { background: rgba(52, 152, 219, 0.1); border-left-color: var(--primary-color); }
        .mobile-cal-date-label { font-weight: bold; font-size: 0.95rem; display: flex; justify-content: space-between; }
        .mobile-cal-events-container { display: flex; flex-direction: column; gap: 4px; }
        .mobile-cal-pill { padding: 6px 10px; color: white; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }

        @media (max-width: 768px) {
            .cal-grid { display: none !important; }
            .mobile-cal-list { display: flex !important; }
            .calendar-week-view { font-size: 0.75rem; gap: 2px !important; }
            .day-number { width: 22px !important; height: 22px !important; font-size: 0.75rem !important; }
        }

        .settings-modal { width: 90% !important; max-width: 750px !important; max-height: 85vh; overflow-y: auto; display: block !important; text-align: left; }
        .sidebar-toggle { position: absolute; top: 20px; right: 5px; background: var(--primary-color); color: white; border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 110; border: 2px solid var(--card-bg); font-weight: bold; box-shadow: var(--shadow); }
        
        .week-navigation-container { background-color: rgba(0,0,0,0.03); border-radius: 8px; padding: 10px; margin-bottom: 15px; }
        .calendar-week-view { display: grid; grid-template-columns: auto repeat(7, 1fr) auto; gap: 5px; text-align: center; align-items: center; }
        .day-number { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; margin: auto; font-size: 0.85rem; }
        .day-number.selected-day { border: 2px solid var(--text-color); }
        .day-preview-box { background-color: #fff9e6; color: #333; border-left: 4px solid #f1c40f; padding: 8px 12px; border-radius: 4px; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body id="app-body">

<button class="quick-version-toggle" id="quick-toggle-btn" style="display:none;" onclick="quickToggleView()">

</button>

</div>

        appId: "1:252785957836:web:498c30a1eb9e7a6b72db69"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function checkPin() {
        if(document.getElementById('pin-input').value === GEHEIMER_PIN) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            document.getElementById('quick-toggle-btn').style.display = 'flex'; // Zeigt den Button nach Login
            initApp();
        } else { document.getElementById('pin-error').style.display = 'block'; }
    }

    function initApp() {
        database.ref('familyZentrumConfig/pin').on('value', (s) => { if(s.val()) GEHEIMER_PIN = s.val().toString(); });
        database.ref('familyZentrumData').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                Object.keys(familyData).forEach(m => {
                    if(data[m]) {
                        familyData[m].todos = data[m].todos || [];
                        familyData[m].topics = data[m].topics || [];
                        familyData[m].events = data[m].events || [];
                    }
                });
            }
            renderAll();
        });
        updateClock(); setInterval(updateClock, 1000); applyGradient(); switchMember(activeMember);
        checkBiometricAvailability();
    }

    function checkBiometricAvailability() {
        if (window.PublicKeyCredential && localStorage.getItem('biometric_registered') === 'true') {
            document.getElementById('biometric-btn').style.display = 'block';
        }
    }

    async function registerBiometrics() {
        if (!window.PublicKeyCredential) { alert("Face ID wird hier nicht unterstützt."); return; }
        if (confirm("Face ID / Touch ID zum Entsperren aktivieren?")) {
            localStorage.setItem('biometric_registered', 'true');
            alert("Aktiviert!");
        }
    }

    function loginWithBiometrics() {
        if (localStorage.getItem('biometric_registered') === 'true') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            document.getElementById('quick-toggle-btn').style.display = 'flex';
            initApp();
        }
    }

    function updateClock() {
        const now = new Date(); const time = now.toLocaleTimeString('de-DE');
        document.querySelectorAll('.clock-display').forEach(el => el.textContent = time);
        document.getElementById('beta-clock-small').textContent = time.substring(0,5);
        const dateString = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
        document.querySelectorAll('.date-display').forEach(el => el.textContent = dateString);
    }

    function syncData() { database.ref('familyZentrumData').set(familyData); }
    
    function toggleSidebar() { 
        const side = document.getElementById('app-sidebar'); const arrow = document.getElementById('side-arrow');
        side.classList.toggle('collapsed'); 
        if(side.classList.contains('collapsed')) { arrow.textContent = "▶"; arrow.style.left = "5px"; } 
        else { arrow.textContent = "◀"; arrow.style.left = "245px"; }
    }

    function switchMember(name) { activeMember = name; selectedDayIndex = null; renderNavButtons(); renderAll(); }

    function renderNavButtons() {
        const list = ["Lukas", "Kathrin", "Marlene", "Anna", "Robert", "Familie"];
        ["person-nav-normal", "person-nav-beta"].forEach(id => {
            const cont = document.getElementById(id); if(!cont) return; cont.innerHTML = "";
            list.forEach(m => {
                const b = document.createElement('button'); b.className = `btn-main ${m === activeMember ? 'active' : ''}`; b.textContent = m; b.onclick = () => switchMember(m); cont.appendChild(b);
            });
        });
    }

    function renderAll() {
        renderNavButtons();
        const isBeta = config.view === 'beta';
        const grid = document.getElementById(isBeta ? 'dashboard-beta' : 'dashboard-normal');
        const dock = document.getElementById(isBeta ? 'dock-beta' : 'dock-normal');
        
        grid.innerHTML = "";
        dock.innerHTML = "";
        
        const bigCalBeta = document.getElementById('family-calendar-beta');
        if(activeMember === 'Familie' && isBeta) { bigCalBeta.style.display = 'block'; renderBigCalendar('cal-grid-body', 'cal-list-body', 'cal-month-name', betaCalScope); } else { bigCalBeta.style.display = 'none'; }
        
        const bigCalNormal = document.getElementById('expanded-calendar-normal');
        if(activeMember === 'Familie' && !isBeta && showExpandedNormalCal) { bigCalNormal.style.display = 'block'; renderBigCalendar('cal-grid-body-normal', 'cal-list-body-normal', 'cal-month-name-normal', 'month'); } else { bigCalNormal.style.display = 'none'; }

        const structures = [
            { id: 'topics', title: activeMember === 'Familie' ? 'Kalender Termine' : 'Lernthemen', show: activeMember !== 'Anna' && activeMember !== 'Robert' },
            { id: 'todo-open', title: 'To-Do: Offen', show: true },
            { id: 'todo-done', title: 'Erledigt', show: true }
        ];

        structures.forEach(s => {
            if(!s.show) return;
            const cardKey = s.id + activeMember;
            
            if(collapsedCards[cardKey]) {
                const miniTrigger = document.createElement('div');
                miniTrigger.className = "card-mini-floating";
                miniTrigger.innerHTML = `<span>${s.title}</span> <b>+</b>`;
                miniTrigger.onclick = () => toggleCardBody(s.id);
                dock.appendChild(miniTrigger);
                return;
            }
            
            const card = document.createElement('div');
            card.className = "card";
            card.setAttribute('draggable', 'true'); 
            card.setAttribute('data-id', s.id);
            
            let headerHtml = `
                <div class="card-header">
                    <span style="font-weight:bold">☰ ${s.title}</span>
                    <button class="btn-mini" onclick="toggleCardBody('${s.id}')">➖ Minimieren</button>
                </div>`;
            let bodyHtml = `<div class="card-body">`;
            
            if(s.id === 'topics' && !isBeta) {
                if(activeMember === 'Familie') {
                    bodyHtml += `
                        <div class="week-navigation-container">
                            <div class="calendar-week-view">
                                <button class="btn-skip-mini" onclick="changeWeek(-1); event.stopPropagation();">◀</button>
                                <div onclick="selectDay(0)">MO<div class="day-number" id="wd-0">-</div></div>
                                <div onclick="selectDay(1)">DI<div class="day-number" id="wd-1">-</div></div>
                                <div onclick="selectDay(2)">MI<div class="day-number" id="wd-2">-</div></div>
                                <div onclick="selectDay(3)">DO<div class="day-number" id="wd-3">-</div></div>
                                <div onclick="selectDay(4)">FR<div class="day-number" id="wd-4">-</div></div>
                                <div onclick="selectDay(5)">SA<div class="day-number" id="wd-5">-</div></div>
                                <div onclick="selectDay(6)">SO<div class="day-number" id="wd-6">-</div></div>
                                <button class="btn-skip-mini" onclick="changeWeek(1); event.stopPropagation();">▶</button>
                            </div>
                        </div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <button class="btn-main" onclick="toggleExpandCalendarNormal()">🔍 Vergrößern (Monat)</button>
                        </div>
                        <div class="day-preview-box" id="day-preview-container" style="display:none;"><div id="day-preview-text">Keine Termine</div></div>
                        <div class="input-group" style="flex-direction:column; gap:5px;">
                            <input type="text" id="event-input" placeholder="Termin-Name...">
                            <input type="date" id="event-start">
                            <button class="btn-main active" onclick="addEvent()">Termin eintragen</button>
                        </div>`;
                } else { bodyHtml += `<div class="input-group"><input type="text" id="topic-input" placeholder="Neues Thema..."><button class="btn-main active" onclick="addTopic()">+</button></div>`; }
            } else if (s.id === 'todo-open') { bodyHtml += `<div class="input-group"><input type="text" id="todo-input" placeholder="Aufgabe..."><button class="btn-main active" onclick="addTodo()">+</button></div>`; }

            bodyHtml += `<ul class="list-container" id="list-${s.id}"></ul></div>`;
            card.innerHTML = headerHtml + bodyHtml;
            grid.appendChild(card);
        });
        fillLists();
        setupDragAndDrop(grid); 
    }

    // --- QUICK TOGGLE LOGIK ---
    function quickToggleView() {
        config.view = config.view === 'normal' ? 'beta' : 'normal';
        document.getElementById('set-view').value = config.view; // Synchronisiert das Einstellungs-Menü
        applyView();
    }

    function setupDragAndDrop(grid) {
        const cards = grid.querySelectorAll('.card');
        cards.forEach(card => {
            card.addEventListener('dragstart', () => card.classList.add('dragging'));
            card.addEventListener('dragend', () => card.classList.remove('dragging'));
        });

        grid.addEventListener('dragover', e => {
            e.preventDefault();
            const afterElement = getDragAfterElement(grid, e.clientX, e.clientY);
            const draggingCard = document.querySelector('.dragging');
            if (draggingCard) {
                if (afterElement == null) { grid.appendChild(draggingCard); } 
                else { grid.insertBefore(draggingCard, afterElement); }
            }
        });
    }

    function getDragAfterElement(grid, x, y) {
        const draggableElements = [...grid.querySelectorAll('.card:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offsetX = x - box.left - box.width / 2;
            const offsetY = y - box.top - box.height / 2;
            if (offsetY < 0 && offsetY > closest.offset) { return { offset: offsetY, element: child }; } 
            else { return closest; }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function toggleCardBody(id) { collapsedCards[id + activeMember] = !collapsedCards[id + activeMember]; renderAll(); }
    function toggleExpandCalendarNormal() { showExpandedNormalCal = !showExpandedNormalCal; renderAll(); }
    
    function setBetaCalScope(scope) {
        betaCalScope = scope;
        document.getElementById('btn-view-month').classList.toggle('active', scope === 'month');
        document.getElementById('btn-view-week').classList.toggle('active', scope === 'week');
        renderBigCalendar('cal-grid-body', 'cal-list-body', 'cal-month-name', scope);
    }

    function renderBigCalendar(gridId, listId, titleId, scope) {
        const grid = document.getElementById(gridId); const list = document.getElementById(listId);
        grid.innerHTML = ""; list.innerHTML = ""; const now = new Date();
        
        if (scope === "month") {
            const firstDay = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
            const lastDay = new Date(now.getFullYear(), now.getMonth() + monthOffset + 1, 0);
            document.getElementById(titleId).textContent = firstDay.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
            let startShift = (firstDay.getDay() + 6) % 7;
            for(let i=0; i<startShift; i++) grid.innerHTML += `<div class="cal-cell" style="opacity:0.2;"></div>`;
            for(let d=1; d<=lastDay.getDate(); d++) { buildCalCell(grid, list, new Date(now.getFullYear(), now.getMonth() + monthOffset, d), d, now); }
        } else if (scope === "week") {
            const currentDay = now.getDay(); const distanceToMonday = currentDay === 0 ? -6 : 1 - currentDay;
            const monday = new Date(now); monday.setDate(now.getDate() + distanceToMonday + (monthOffset * 7));
            const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
            document.getElementById(titleId).textContent = `KW ${getWeekNumber(monday)}`;
            for(let i=0; i<7; i++) { let cellDate = new Date(monday); cellDate.setDate(monday.getDate() + i); buildCalCell(grid, list, cellDate, cellDate.toLocaleDateString('de-DE', {weekday: 'short'}) + " " + cellDate.getDate(), now); }
        }
    }

    function buildCalCell(grid, list, cellDate, label, now) {
        const dateStr = cellDate.toISOString().split('T')[0]; const isToday = cellDate.toDateString() === now.toDateString();
        const cell = document.createElement('div'); cell.className = `cal-cell ${isToday ? 'today' : ''}`; cell.innerHTML = `<div class="cal-num">${label}</div>`; cell.onclick = () => openEventModal(dateStr);
        
        const row = document.createElement('div'); row.className = `mobile-cal-row ${isToday ? 'today' : ''}`; row.innerHTML = `<div class="mobile-cal-date-label"><span>${cellDate.toLocaleDateString('de-DE', {weekday: 'short', day: 'numeric', month: 'numeric'})}</span></div>`; row.onclick = () => openEventModal(dateStr);
        const mobileEventsContainer = document.createElement('div'); mobileEventsContainer.className = "mobile-cal-events-container";
        let dayHasEvents = false;

        (familyData.Familie.events || []).forEach((e, idx) => {
            if(dateStr === e.start) {
                dayHasEvents = true;
                cell.innerHTML += `<div class="cal-event" style="background:${e.color || '#3498db'};" onclick="event.stopPropagation(); openNotes(${idx}, true);">${e.name}</div>`;
                const pill = document.createElement('div'); pill.className = "mobile-cal-pill"; pill.style.backgroundColor = e.color || '#3498db'; pill.textContent = e.name;
                pill.onclick = (event) => { event.stopPropagation(); openNotes(idx, true); };
                mobileEventsContainer.appendChild(pill);
            }
        });
        grid.appendChild(cell);
        if(dayHasEvents || isToday) { row.appendChild(mobileEventsContainer); list.appendChild(row); }
    }

    function getWeekNumber(d) { d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7)); var s = new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.ceil((((d - s) / 86400000) + 1)/7); }

    function fillLists() {
        const data = familyData[activeMember]; const leftList = document.getElementById('list-topics'); if(!leftList) return;
        if(activeMember === 'Familie') {
            updateNormalWeekBar();
            (data.events || []).forEach((e, i) => { leftList.innerHTML += `<li class="list-item"><span class="clickable-text" onclick="openNotes(${i}, true)"><strong>${e.name}</strong> <small>(${new Date(e.start).toLocaleDateString('de-DE')})</small></span><button class="btn-delete" onclick="deleteEvent(${i})">X</button></li>`; });
        } else {
            (data.topics || []).forEach((t, i) => { leftList.innerHTML += `<li class="list-item"><span class="clickable-text" onclick="openNotes(${i}, false)">${t.name} <small>(${t.notes?t.notes.length:0} Infos)</small></span><button class="btn-delete" onclick="deleteTopic(${i})">X</button></li>`; });
        }
        const oList = document.getElementById('list-todo-open'); const dList = document.getElementById('list-todo-done');
        if(oList && dList) {
            (data.todos || []).forEach((todo, i) => {
                const html = `<li class="list-item"><span style="display:flex; gap:10px; align-items:center;"><input type="checkbox" ${todo.completed?'checked':''} onchange="toggleTodo(${i})"><span>${todo.title}</span></span><button class="btn-delete" onclick="deleteTodo(${i})">X</button></li>`;
                if(todo.completed) dList.innerHTML += html; else oList.innerHTML += html;
            });
        }
    }

    function openEventModal(dateStr) { document.getElementById('quick-event-date').value = dateStr; document.getElementById('quick-event-name').value = ""; document.getElementById('event-modal').style.display = 'flex'; }
    function closeEventModal() { document.getElementById('event-modal').style.display = 'none'; }
    function saveQuickEvent() {
        const name = document.getElementById('quick-event-name').value; const date = document.getElementById('quick-event-date').value; const color = document.getElementById('quick-event-color').value;
        if(name.trim() && date) { familyData.Familie.events.push({ name: name.trim(), start: date, end: date, color: color, notes: [] }); syncData(); closeEventModal(); }
    }

    function changeMonth(dir) { monthOffset += dir; renderAll(); }
    function jumpToToday() { monthOffset = 0; renderAll(); }

    function updateNormalWeekBar() {
        const now = new Date(); const currentDay = now.getDay(); const distanceToMonday = currentDay === 0 ? -6 : 1 - currentDay; const monday = new Date(now); monday.setDate(now.getDate() + distanceToMonday + (weekOffset * 7));
        currentWeekDates = []; for(let i = 0; i < 7; i++) { let d = new Date(monday); d.setDate(monday.getDate() + i); currentWeekDates.push({ dayNum: d.getDate(), fullDateStr: d.toISOString().split('T')[0] }); }
        for(let i = 0; i < 7; i++) {
            const el = document.getElementById(`wd-${i}`); if(!el) continue; el.textContent = currentWeekDates[i].dayNum; el.className = 'day-number' + (selectedDayIndex === i ? ' selected-day' : ''); el.style.backgroundColor = ''; el.style.color = '';
            (familyData.Familie.events || []).forEach(e => { if(currentWeekDates[i].fullDateStr === e.start) { el.style.backgroundColor = e.color || '#e67e22'; el.style.color = 'white'; } });
        }
    }

    function selectDay(index) {
        const container = document.getElementById('day-preview-container');
        if (selectedDayIndex === index) { selectedDayIndex = null; container.style.display = 'none'; } 
        else {
            selectedDayIndex = index; const target = currentWeekDates[index].fullDateStr; const active = (familyData.Familie.events || []).filter(e => target === e.start); container.style.display = 'block';
            document.getElementById('day-preview-text').innerHTML = active.length === 0 ? `<em>Keine Termine</em>` : active.map(e => `• <strong>${e.name}</strong>`).join('<br>');
        }
        renderAll();
    }

    function flipHeader() { document.querySelectorAll('.header-flip-element').forEach(el => el.classList.add('flipped')); if(flipTimer) clearTimeout(flipTimer); flipTimer = setTimeout(() => document.querySelectorAll('.header-flip-element').forEach(el => el.classList.remove('flipped')), 5000); }
    function openSettings() { document.getElementById('pin-old').value = ""; document.getElementById('pin-new1').value = ""; document.getElementById('pin-new2').value = ""; document.getElementById('settings-modal').style.display='flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display='none'; }
    function toggleDarkMode() { config.darkMode = !config.darkMode; document.getElementById('app-body').classList.toggle('dark-mode', config.darkMode); }
    
    function applyGradient() {
        const grad = document.getElementById('set-color').value; config.gradient = grad; document.getElementById('app-body').style.setProperty('--header-gradient', grad);
        const extractedColor = grad.includes('f1c40f') ? '#e67e22' : (grad.includes('00cec9') ? '#0984e3' : (grad.includes('00f2fe') ? '#00f2fe' : '#8e44ad'));
        document.getElementById('app-body').style.setProperty('--primary-color', extractedColor); renderAll();
    }
    
    function applyView() { 
        config.view = document.getElementById('set-view').value; 
        document.getElementById('view-normal').style.display = config.view === 'normal' ? 'block' : 'none'; 
        document.getElementById('view-beta').style.display = config.view === 'beta' ? 'flex' : 'none'; 
        
        // Text des Schnell-Wechsel-Buttons aktualisieren
        const toggleText = document.getElementById('quick-toggle-text');
        if(toggleText) {
            toggleText.textContent = config.view === 'normal' ? 'Wechsle zu Beta 1.12' : 'Wechsle zu Version 1.1';
        }
        
        switchMember(activeMember); 
    }
    
    function updatePin() {
        const oldP = document.getElementById('pin-old').value.trim(); const n1 = document.getElementById('pin-new1').value.trim(); const n2 = document.getElementById('pin-new2').value.trim();
        if(oldP === GEHEIMER_PIN) {
            if(n1 === n2 && n1.length === 4) {
                GEHEIMER_PIN = n1; database.ref('familyZentrumConfig/pin').set(n1)
                    .then(() => { alert("🚀 PIN erfolgreich geändert!"); closeSettings(); })
                    .catch(() => { alert("Fehler beim Cloud-Speichern!"); });
            } else { alert("Die neuen PINs stimmen nicht überein!"); }
        } else { alert("Der aktuelle PIN ist falsch!"); }
    }

    function openNotes(i, isCalEvent) { 
        activeItemIndex = i; isCalEventModalActive = isCalEvent; const delBtn = document.getElementById('modal-direct-delete-btn');
        if(isCalEvent) { document.getElementById('modal-title').textContent = familyData.Familie.events[i].name; delBtn.style.display = "block"; } 
        else { document.getElementById('modal-title').textContent = familyData[activeMember].topics[i].name; delBtn.style.display = "block"; }
        document.getElementById('notes-modal').style.display = 'flex'; renderNotes(); 
    }
    function closeModal() { document.getElementById('notes-modal').style.display = 'none'; renderAll(); }
    function deleteActiveItemDirectly() { if(confirm("Möchtest du das wirklich sofort löschen?")) { if(isCalEventModalActive) { familyData.Familie.events.splice(activeItemIndex, 1); selectedDayIndex = null; } else { familyData[activeMember].topics.splice(activeItemIndex, 1); } syncData(); closeModal(); } }
    function renderNotes() { const list = document.getElementById('modal-notes-list'); list.innerHTML = ''; let notes = isCalEventModalActive ? familyData.Familie.events[activeItemIndex].notes || [] : familyData[activeMember].topics[activeItemIndex].notes || []; if(notes.length === 0) { list.innerHTML = '<li>Keine Notizen</li>'; return; } notes.forEach((n, ni) => { list.innerHTML += `<li style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>• ${n}</span><button class="btn-delete" onclick="deleteNote(${ni})">X</button></li>`; }); }
    function addNote() { const input = document.getElementById('note-input'); if(input.value.trim()) { let item = isCalEventModalActive ? familyData.Familie.events[activeItemIndex] : familyData[activeMember].topics[activeItemIndex]; if(!item.notes) item.notes = []; item.notes.push(input.value.trim()); input.value=''; syncData(); renderNotes(); } }
    function deleteNote(ni) { if(isCalEventModalActive) { familyData.Familie.events[activeItemIndex].notes.splice(ni,1); } else { familyData[activeMember].topics[activeItemIndex].notes.splice(ni,1); } syncData(); renderNotes(); }
    function addEvent() { const name = document.getElementById('event-input'); const start = document.getElementById('event-start'); if(name.value.trim() && start.value) { familyData.Familie.events.push({ name: name.value.trim(), start: start.value, end: start.value, color: '#3498db', notes: [] }); name.value=''; start.value=''; syncData(); } }
    function deleteEvent(i) { if(confirm("Termin löschen?")) { familyData.Familie.events.splice(i,1); selectedDayIndex = null; syncData(); } }
    function addTopic() { const input = document.getElementById('topic-input'); if(input.value.trim()) { familyData[activeMember].topics.push({name: input.value.trim(), notes: []}); input.value=''; syncData(); } }
    function deleteTopic(i) { if(confirm("Thema löschen?")) { familyData[activeMember].topics.splice(i,1); syncData(); } }
    function addTodo() { const input = document.getElementById('todo-input'); if(input.value.trim()) { if(!familyData[activeMember].todos) familyData[activeMember].todos = []; familyData[activeMember].todos.push({title: input.value.trim(), completed: false}); input.value=''; syncData(); } }
    function toggleTodo(i) { familyData[activeMember].todos[i].completed = !familyData[activeMember].todos[i].completed; syncData(); }
    function deleteTodo(i) { familyData[activeMember].todos.splice(i,1); syncData(); }
    function changeWeek(dir) { weekOffset += dir; renderAll(); }
</script>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familien-Zentrum v1.31</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #3498db;
            --header-gradient: linear-gradient(135deg, #8e44ad, #3498db, #2ecc71);
            --border-radius: 16px;
            --shadow: 0 8px 15px rgba(0,0,0,0.05);
        }

        .dark-mode { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; transition: background 0.2s, color 0.2s; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; }

        /* --- DASHBOARD LAYOUT & SIZES --- */
        .dashboard-grid { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            justify-content: center; 
            align-items: flex-start;
            padding: 20px;
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            box-shadow: var(--shadow); 
            display: flex; 
            flex-direction: column; 
            border-top: 5px solid var(--primary-color);
            transition: all 0.3s ease;
            position: relative;
        }

        /* Größen-Klassen */
        .size-small { width: 300px; height: 300px; }
        .size-medium { width: 450px; height: 560px; }
        .size-large { width: 95%; max-width: 900px; height: 700px; }

        .card.dragging { opacity: 0.5; transform: scale(0.95); }

        .card-header { padding: 15px 20px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; cursor: grab; user-select: none; }
        .card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; overflow: auto; }
        
        /* ... restliche Styles ... */
        .quick-version-toggle { position: fixed; top: 15px; right: 15px; z-index: 4500; background: var(--header-gradient); color: white; padding: 8px 16px; border-radius: 30px; cursor: pointer; }
        .login-overlay { position: fixed; inset: 0; background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); width: 90%; max-width: 400px; }
        .btn-main { padding: 10px 20px; border-radius: 12px; border: none; cursor: pointer; background: #e0e0e0; font-weight: bold; }
        .btn-main.active { background-color: var(--primary-color); color: white; }
        .btn-mini { border: none; background: rgba(0,0,0,0.05); cursor: pointer; padding: 5px 8px; border-radius: 6px; font-size: 0.75rem; }
    </style>
</head>
<body>

<div class="login-overlay" id="login-screen">
    <div class="login-box">
        <h2>🔒 Familien-Zentrum</h2>
        <input type="password" id="pin-input" placeholder="••••" style="width:100%; padding:10px; margin:15px 0;">
        <button class="btn-main active" style="width:100%" onclick="checkPin()">Einloggen</button>
    </div>
</div>

<div id="app-content" style="display:none">
    <div id="dashboard-normal" class="dashboard-grid"></div>
</div>

<script>
    let GEHEIMER_PIN = "1234";
    let activeMember = "Lukas";
    let familyData = { 
        Lukas: { todos: [], cardSizes: {} }, 
        Familie: { todos: [], cardSizes: {} } 
        // ... weitere Personen
    };

    const firebaseConfig = { /* DEINE CONFIG HIER */ };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function checkPin() {
        if(document.getElementById('pin-input').value === GEHEIMER_PIN) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            renderAll();
        }
    }

    // --- GRÖSSENÄNDERUNG ---
    function updateCardSize(cardId, sizeClass) {
        if (!familyData[activeMember].cardSizes) familyData[activeMember].cardSizes = {};
        familyData[activeMember].cardSizes[cardId] = sizeClass;
        renderAll();
    }

    // --- DRAG & DROP LOGIK ---
    function setupDragAndDrop() {
        const grid = document.querySelector('.dashboard-grid');
        const cards = grid.querySelectorAll('.card');

        cards.forEach(card => {
            card.setAttribute('draggable', 'true');
            card.addEventListener('dragstart', () => card.classList.add('dragging'));
            card.addEventListener('dragend', () => card.classList.remove('dragging'));
        });

        grid.addEventListener('dragover', e => {
            e.preventDefault();
            const afterElement = getDragAfterElement(grid, e.clientY);
            const dragging = document.querySelector('.dragging');
            if (afterElement == null) grid.appendChild(dragging);
            else grid.insertBefore(dragging, afterElement);
        });
    }

    function getDragAfterElement(container, y) {
        const elements = [...container.querySelectorAll('.card:not(.dragging)')];
        return elements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            return (offset < 0 && offset > closest.offset) ? { offset, element: child } : closest;
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // --- RENDER LOGIK ---
    function renderAll() {
        const grid = document.getElementById('dashboard-normal');
        grid.innerHTML = "";

        const sections = [
            { id: 'todos', title: 'To-Do Liste' },
            { id: 'calendar', title: 'Kalender' }
        ];

        sections.forEach(s => {
            const size = familyData[activeMember].cardSizes?.[s.id] || 'size-medium';
            
            const card = document.createElement('div');
            card.className = `card ${size}`;
            
            card.innerHTML = `
                <div class="card-header">
                    <span>☰ ${s.title}</span>
                    <select onchange="updateCardSize('${s.id}', this.value)" class="btn-mini">
                        <option value="size-small" ${size=='size-small'?'selected':''}>Klein</option>
                        <option value="size-medium" ${size=='size-medium'?'selected':''}>Mittel</option>
                        <option value="size-large" ${size=='size-large'?'selected':''}>Groß</option>
                    </select>
                </div>
                <div class="card-body">Inhalt für ${s.title}...</div>
            `;
            grid.appendChild(card);
        });

        setupDragAndDrop(); // WICHTIG: Nach dem Einfügen ins DOM aufrufen
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unser Familien-Zentrum</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #3498db;
            --accent-color: #2ecc71;
            --delete-color: #e74c3c;
            --border-radius: 12px;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; }
        
        header { 
            background: linear-gradient(135deg, #8e44ad, var(--primary-color)); 
            color: white; padding: 20px; border-radius: var(--border-radius); 
            text-align: center; margin-bottom: 20px; box-shadow: var(--shadow); 
        }
        #clock { font-size: 2.5rem; font-weight: bold; margin-bottom: 5px; }
        #date { font-size: 1.1rem; opacity: 0.9; }
        .setup-banner { background-color: #e74c3c; color: white; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold; }

        /* Personen Navigations-Leiste */
        .family-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .member-btn {
            background-color: #fff;
            color: #333;
            border: 2px solid #ddd;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }
        .member-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }
        .member-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Dashboard Gitter */
        .dashboard-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
        }
        .card { background-color: var(--card-bg); border-radius: var(--border-radius); padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; height: 420px; }
        .card h2 { font-size: 1.2rem; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid #eee; color: #2c3e50; display: flex; justify-content: space-between; align-items: center; }
        .counter-badge { background-color: #eee; color: #666; font-size: 0.85rem; padding: 2px 8px; border-radius: 20px; font-weight: normal; }
        
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .input-group input, .input-group [type="date"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; outline: none; }
        .input-group button { background-color: var(--primary-color); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; white-space: nowrap; }
        
        .list-container { overflow-y: auto; flex: 1; list-style: none; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: #f9f9f9; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid var(--primary-color); }
        .clickable-text { cursor: pointer; flex: 1; padding-right: 10px; }
        .clickable-text:hover { color: var(--primary-color); text-decoration: underline; }
        .list-item.completed { border-left-color: #bdc3c7; opacity: 0.7; }
        .list-item.completed .item-text { text-decoration: line-through; color: #7f8c8d; }
        .item-content { display: flex; align-items: center; gap: 10px; flex: 1; }
        .item-text { font-size: 0.95rem; word-break: break-word; }
        .item-date { font-size: 0.8rem; color: #7f8c8d; margin-left: auto; padding-right: 10px; }
        .btn-delete { background: none; border: none; color: var(--delete-color); cursor: pointer; font-size: 1.1rem; padding: 2px 6px; border-radius: 4px; }
        .btn-delete:hover { background-color: #fde8e7; }
        .checkbox { width: 18px; height: 18px; cursor: pointer; }
        
        /* Spaltenfarben */
        .card.lernthemen .list-item { border-left-color: #9b59b6; }
        .card.kalender .list-item { border-left-color: #e67e22; }
        .card.todo-open .list-item { border-left-color: #e67e22; }
        .card.todo-done .list-item { border-left-color: var(--accent-color); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background-color: white; padding: 25px; border-radius: var(--border-radius); width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; flex-direction: column; max-height: 80vh; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #eee; }
        .modal-header h3 { color: #9b59b6; word-break: break-word; }
        .btn-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #7f8c8d; }
        .notes-list { list-style: none; overflow-y: auto; flex: 1; margin-bottom: 15px; }
        .note-item { background-color: #fcf8e3; border-left: 4px solid #f1c40f; padding: 10px; border-radius: 4px; margin-bottom: 8px; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: flex-start; word-break: break-word; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-notice" class="setup-banner">⚠️ Cloud-Modus inaktiv. Verbindung zur Datenbank wird aufgebaut...</div>
    
    <header>
        <div id="clock">00:00:00</div>
        <div id="date">Lade Datum...</div>
    </header>

    <div class="family-nav">
        <button class="member-btn active" onclick="switchMember('Lukas')">👦 Lukas</button>
        <button class="member-btn" onclick="switchMember('Kathrin')">👩 Kathrin</button>
        <button class="member-btn" onclick="switchMember('Marlene')">👧 Marlene</button>
        <button class="member-btn" onclick="switchMember('Anna')">🦄 Anna</button>
        <button class="member-btn" onclick="switchMember('Robert')">👨 Robert</button>
    </div>

    <h2 id="current-title" style="text-align: center; margin-bottom: 20px; color: #2c3e50;">Dashboard von Lukas</h2>

    <div class="dashboard-grid">
        <div class="card lernthemen" id="lernthemen-card">
            <h2>📚 Lernthemen <small style="font-size: 0.75rem; color:#7f8c8d; font-weight:normal;">(Klicken für Notizen)</small></h2>
            <div class="input-group">
                <input type="text" id="topic-input" placeholder="Neues Thema...">
                <button onclick="addTopic()">Hinzufügen</button>
            </div>
            <ul id="topics-list" class="list-container"></ul>
        </div>

        <div class="card todo-open">
            <h2>📝 To-Do: Offen <span id="counter-open" class="counter-badge">0</span></h2>
            <div class="input-group">
                <input type="text" id="todo-input" placeholder="Neue Aufgabe...">
                <button onclick="addTodo()">+ Los</button>
            </div>
            <ul id="todos-open-list" class="list-container"></ul>
        </div>

        <div class="card todo-done">
            <h2>🎉 Erledigt <span id="counter-done" class="counter-badge">0</span></h2>
            <div style="margin-bottom: 15px; height: 38px; display: flex; align-items: center; color: #7f8c8d; font-size: 0.9rem; font-style: italic;">
                Gute Arbeit!
            </div>
            <ul id="todos-done-list" class="list-container"></ul>
        </div>
    </div>
</div>

<div id="notes-modal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="modal-title">Thema Details</h3>
            <button class="btn-close" onclick="closeModal()">×</button>
        </div>
        <h4 style="margin-bottom: 8px; color: #555; font-size: 0.9rem;">Notizen:</h4>
        <ul id="modal-notes-list" class="notes-list"></ul>
        <div class="input-group" style="margin-bottom: 0;">
            <input type="text" id="note-input" placeholder="Wichtige Info merken...">
            <button onclick="addNote()" style="background-color: #9b59b6;">Merken</button>
        </div>
    </div>
</div>
